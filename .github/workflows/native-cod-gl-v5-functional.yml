    - name: Build matching simulator bridge closure
      id: bridge_build
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,pathlib,subprocess\nroot=pathlib.Path('.work/cod-gl-v5-functional').absolute();plan=json.loads((root/'plan.json').read_text())\n\
        assert plan['root']==str(root)\nsource=pathlib.Path(plan['source']);tools=plan['tools'];sdk=plan['sdk']\n\
        env=dict(os.environ,DEVELOPER_DIR=plan['developer']);records=[]\nfor key in ('SDKROOT','TOOLCHAINS','CC','CXX','CFLAGS','CXXFLAGS','LDFLAGS','MACOSX_DEPLOYMENT_TARGET','IPHONEOS_DEPLOYMENT_TARGET'):\n\
        \    env.pop(key,None)\ndef run(label,args,timeout=120,cwd=None):\n    args=list(map(str,args));p=subprocess.run(args,cwd=cwd\
        \ or root,env=env,capture_output=True,timeout=timeout)\n    (root/(label+'.stdout.txt')).write_bytes(p.stdout);(root/(label+'.stderr.txt')).write_bytes(p.stderr)\n\
        \    records.append({'label':label,'argv':args,'exitCode':p.returncode,'stdoutSha256':hashlib.sha256(p.stdout).hexdigest(),'stderrSha256':hashlib.sha256(p.stderr).hexdigest()})\n\
        \    (root/'build-commands.json').write_text(json.dumps(records,indent=2));print(label,'exit',p.returncode,flush=True)\n\
        \    if p.returncode:\n        print(p.stdout.decode(errors='replace')[-24000:]);print(p.stderr.decode(errors='replace')[-24000:])\n\
        \    assert p.returncode==0,label\n    return p.stdout.decode().strip()\nadapter=root/'apple_alias_adapter.h'\n\
        assert not any(c.isspace() for c in str(adapter))\nflags='-include '+str(adapter)\nconfigure=['cmake','-S',source,'-B',root/'build','-G','Unix\
        \ Makefiles',\n  '-DCMAKE_SYSTEM_NAME=iOS','-DCMAKE_SYSTEM_PROCESSOR=arm64','-DCMAKE_OSX_ARCHITECTURES=arm64',\n\
        \  '-DCMAKE_OSX_SYSROOT='+sdk,'-DCMAKE_OSX_DEPLOYMENT_TARGET=26.0','-DCMAKE_C_COMPILER='+tools['clang'],\n\
        \  '-DCMAKE_C_COMPILER_TARGET=arm64-apple-ios26.0-simulator','-DCMAKE_AR='+tools['ar'],'-DCMAKE_RANLIB='+tools['ranlib'],\n\
        \  '-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY','-DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER',\n  '-DCMAKE_BUILD_TYPE=Release','-DCMAKE_C_FLAGS='+flags,'-DCMAKE_C_FLAGS_RELEASE=-O2\
        \ -DNDEBUG',\n  '-DNOX11=ON','-DNOEGL=ON','-DSTATICLIB=ON','-DNO_LOADER=ON','-DNO_INIT_CONSTRUCTOR=ON',\n\
        \  '-DDEFAULT_ES=2','-DGBM=OFF','-DEGL_WRAPPER=OFF','-DUSE_CCACHE=OFF','-DCMAKE_EXPORT_COMPILE_COMMANDS=ON']\n\
        run('configure-gl4es',configure)\nrun('build-full-static-gl4es',['cmake','--build',root/'build','--target','GL','--parallel','3'],1200)\n\
        archive=source/'lib/libGL.a';assert archive.is_file() and archive.stat().st_size>100000\nflags=['-target','arm64-apple-ios26.0-simulator','-isysroot',sdk,'-O2','-fvisibility=hidden','-Wall','-Wextra','-Werror','-Wno-error=deprecated-declarations','-I'+str(source/'include')]\n\
        \nfor name in ('cod_gl_dispatch','cod_gl4es_execute'):\n    run('compile-'+name,[tools['clang'],*flags,'-std=c11','-fno-fast-math','-c',root/(name+'.c'),'-o',root/(name+'.o')])\n\
        run('compile-dedicated-uikit-eagl-worker',[tools['clang'],*flags,'-fobjc-arc','-fblocks','-c',root/'cod_gl_ios.m','-o',root/'cod_gl_ios.o'])\n\
        \nimport shlex\ndb=json.loads((root/'build/compile_commands.json').read_text())\nexpected_glstate=(source/'src/gl/glstate.c').resolve()\n\
        selected=[]\nfor row in db:\n    p=pathlib.Path(row['file'])\n    if not p.is_absolute():p=pathlib.Path(row['directory'])/p\n\
        \    if p.resolve()==expected_glstate:selected.append(row)\nassert len(selected)==1\nrow=selected[0];original=shlex.split(row['command']);matching=list(original)\n\
        assert pathlib.Path(matching[0]).resolve()==pathlib.Path(tools['clang']).resolve()\nassert matching.count('-c')==matching.count('-o')==1\n\
        source_at=matching.index('-c')+1;output_at=matching.index('-o')+1\nactual_input=pathlib.Path(matching[source_at])\n\
        if not actual_input.is_absolute():actual_input=pathlib.Path(row['directory'])/actual_input\nassert actual_input.resolve()==expected_glstate\n\
