name: Native GL bridge actual UIKit state and pixels
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-cod-gl-v5-functional-20261028
    paths:
    - .github/workflows/native-cod-gl-v5-functional.yml
permissions:
  contents: read
concurrency:
  group: native-cod-gl-v5-functional
  cancel-in-progress: false
jobs:
  native-bridge-functional:
    if: github.repository == 'lasmith1689-sys/gowpad' && github.ref == 'refs/heads/codex/native-cod-gl-v5-functional-20261028'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Pin public source and select only an installed simulator runtime
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport os,json,pathlib\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/gowpad'\n\
        assert os.environ['GITHUB_REF']=='refs/heads/codex/native-cod-gl-v5-functional-20261028'\nassert os.environ['GITHUB_EVENT_NAME']\
        \ in ('push','workflow_dispatch')\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        assert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/gowpad'\n\
        if os.environ['GITHUB_EVENT_NAME']=='push':assert event['after']==os.environ['GITHUB_SHA'] and not event.get('deleted',False)\n\
        import base64,hashlib,json,zlib,os,pathlib,re,subprocess\nroot=pathlib.Path('.work/cod-gl-v5-functional').absolute()\n\
        assert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))\nroot.mkdir(parents=True)\n\
        env=dict(os.environ,GIT_TERMINAL_PROMPT='0',HOMEBREW_NO_AUTO_UPDATE='1')\nfor key in ('SDKROOT','TOOLCHAINS','CC','CXX','CFLAGS','CXXFLAGS','LDFLAGS','MACOSX_DEPLOYMENT_TARGET','IPHONEOS_DEPLOYMENT_TARGET'):\n\
        \    env.pop(key,None)\ndef run(label,args):\n    p=subprocess.run(list(map(str,args)),cwd=root,env=env,capture_output=True,timeout=120)\n\
        \    (root/(label+'.stdout.txt')).write_bytes(p.stdout);(root/(label+'.stderr.txt')).write_bytes(p.stderr)\n\
        \    print(label,'exit',p.returncode,flush=True)\n    if p.returncode:print(p.stdout.decode(errors='replace'));print(p.stderr.decode(errors='replace'))\n\
        \    assert p.returncode==0,label\n    return p.stdout.decode().strip()\ndeveloper=run('developer',['xcode-select','-p']);env['DEVELOPER_DIR']=developer\n\
        sdk=pathlib.Path(run('sdk',['xcrun','--sdk','iphonesimulator','--show-sdk-path']))\nsdkversion=run('sdk-version',['xcrun','--sdk','iphonesimulator','--show-sdk-version'])\n\
        assert int(sdkversion.split('.')[0])>=26 and sdk.is_dir()\ntools={name:run('find-'+name,['xcrun','--sdk','iphonesimulator','--find',name])\
        \ for name in ['clang','ar','ranlib','nm']}\nassert all(pathlib.Path(p).is_absolute() and pathlib.Path(p).is_file()\
        \ for p in tools.values())\nassert pathlib.Path(developer).resolve() in pathlib.Path(tools['clang']).resolve().parents\n\
        versions={'xcode':run('xcode-version',['xcodebuild','-version']),'clang':run('clang-version',[tools['clang'],'--version']),\n\
        \          'cmake':run('cmake-version',['cmake','--version']),'make':run('make-version',['make','--version'])}\n\
        frameworks=sdk/'System/Library/Frameworks'\nneeded=['UIKit.framework/Headers/UIKit.h','UIKit.framework/UIKit.tbd',\n\
        \  'QuartzCore.framework/Headers/CAEAGLLayer.h','QuartzCore.framework/QuartzCore.tbd',\n  'OpenGLES.framework/Headers/EAGL.h','OpenGLES.framework/Headers/ES2/gl.h','OpenGLES.framework/OpenGLES.tbd',\n\
        \  'Foundation.framework/Foundation.tbd','CoreFoundation.framework/CoreFoundation.tbd']\nsdkinputs={}\n\
        for relative in needed:\n    p=frameworks/relative;assert p.is_file(),('Required in-place Apple SDK input\
        \ absent',relative)\n    sdkinputs[relative]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}\n\
        pin='2037865590d410bcd7b8d1f22b841472ed6d39ac';url='https://github.com/ptitSeb/gl4es.git'\nassert re.fullmatch('[0-9a-f]{40}',pin)\
        \ and url=='https://github.com/ptitSeb/gl4es.git'\nsource=root/'source';source.mkdir()\ngit=['git','-c','credential.helper=','-c','core.hooksPath=/dev/null','-c','core.autocrlf=false','-C',source]\n\
        run('source-init',git+['init','--quiet'])\nrun('source-fetch',git+['fetch','--depth=1','--no-tags',url,pin])\n\
        run('source-checkout',git+['checkout','--detach','FETCH_HEAD'])\nassert run('source-pin',git+['rev-parse','HEAD'])==pin\n\
        sourcehashes={'LICENSE': {'sha256': '69a3049c77abd88658f6ad7cf6a5b6ceb5cf03b80e60f7c4657d90322cfab7bd',\
        \ 'bytes': 1105}, 'README.md': {'sha256': '3009610981bd589f29e5b3efe06331041a69899f8dfa4c684e36217775cafe2c',\
        \ 'bytes': 4681}, 'COMPILE.md': {'sha256': 'fdd7a2d8f08bb3cf7d41b881114eb15e666a76dc6755b1dc8037dd96cce70360',\
        \ 'bytes': 6870}, 'CMakeLists.txt': {'sha256': '3ea6228a4b3e527a01645fe223afd8b7c170281ed358020c7efa979bb7feda2e',\
        \ 'bytes': 11571}, 'src/CMakeLists.txt': {'sha256': '141450dea053a650fbf2e0a6d22f930eda7fa801563e59004ddb73daa85264ce',\
        \ 'bytes': 9559}, 'src/gl/attributes.h': {'sha256': 'c65c44765d2c00bb1f360f7ce51fcd7c0d2d25edd56e732810bb4421106f1467',\
        \ 'bytes': 5920}, 'src/gl/directstate.c': {'sha256': 'a805b7631f331a2437eeaa358037fc69fe42c9d9450800ecc04aac2944dde613',\
        \ 'bytes': 42219}, 'src/gl/loader.c': {'sha256': '62896167f73fe5fcb38acad339750f6cfbb4a7db2573df34415fb1b43c078bde',\
        \ 'bytes': 5241}, 'src/gl/loader.h': {'sha256': '3a3de23684db3957a3843850e5d3399ee9afb03b92bae6ea433aee74bd42f625',\
        \ 'bytes': 12059}, 'src/gl/init.c': {'sha256': '35804e977fb5bd3e8a7cdae192a95bfb93e89bbb201392f65daaecdd7d165969',\
        \ 'bytes': 24652}, 'include/GL/gl.h': {'sha256': 'd03e03f7874502bcb5125dac530993555d37ebcfcf602354426a812f68160366',\
        \ 'bytes': 84831}, 'include/gl4esinit.h': {'sha256': '3da0beccca54312010e74e1e99814ae64b38e9ccceb782648afcaa83283af6ad',\
        \ 'bytes': 903}}\nfor name,row in sourcehashes.items():\n    data=(source/name).read_bytes();assert len(data)==row['bytes']\
        \ and hashlib.sha256(data).hexdigest()==row['sha256'],name\naliaslines=[line.strip() for p in (source/'src').rglob('*.c')\
        \ for line in p.read_text().splitlines() if 'AliasDecl(' in line]\nexpected=['AliasDecl(void,gl4es_glEnableClientStatei,(GLenum\
        \ array, GLuint index),gl4es_glEnableClientStateIndexed);',\n          'AliasDecl(void,gl4es_glDisableClientStatei,(GLenum\
        \ array, GLuint index),gl4es_glDisableClientStateIndexed);']\nassert aliaslines==expected,aliaslines\nproduction_sources=['src/gl/arbconverter.c',\
        \ 'src/gl/arbgenerator.c', 'src/gl/arbhelper.c', 'src/gl/arbparser.c', 'src/gl/array.c', 'src/gl/blit.c',\
        \ 'src/gl/blend.c', 'src/gl/buffers.c', 'src/gl/build_info.c', 'src/gl/debug.c', 'src/gl/decompress.c',\
        \ 'src/gl/depth.c', 'src/gl/directstate.c', 'src/gl/drawing.c', 'src/gl/enable.c', 'src/gl/envvars.c', 'src/gl/eval.c',\
        \ 'src/gl/face.c', 'src/gl/fog.c', 'src/gl/fpe.c', 'src/gl/fpe_cache.c', 'src/gl/fpe_shader.c', 'src/gl/framebuffers.c',\
        \ 'src/gl/gl_lookup.c', 'src/gl/getter.c', 'src/gl/gl4es.c', 'src/gl/glstate.c', 'src/gl/hint.c', 'src/gl/init.c',\
        \ 'src/gl/light.c', 'src/gl/line.c', 'src/gl/list.c', 'src/gl/listdraw.c', 'src/gl/listrl.c', 'src/gl/loader.c',\
        \ 'src/gl/logs.c', 'src/gl/matrix.c', 'src/gl/matvec.c', 'src/gl/oldprogram.c', 'src/gl/pixel.c', 'src/gl/planes.c',\
        \ 'src/gl/pointsprite.c', 'src/gl/preproc.c', 'src/gl/program.c', 'src/gl/queries.c', 'src/gl/raster.c',\
        \ 'src/gl/render.c', 'src/gl/samplers.c', 'src/gl/shader.c', 'src/gl/shaderconv.c', 'src/gl/shader_hacks.c',\
        \ 'src/gl/stack.c', 'src/gl/stencil.c', 'src/gl/string_utils.c', 'src/gl/stubs.c', 'src/gl/texenv.c', 'src/gl/texgen.c',\
        \ 'src/gl/texture.c', 'src/gl/texture_compressed.c', 'src/gl/texture_params.c', 'src/gl/texture_read.c',\
        \ 'src/gl/texture_3d.c', 'src/gl/uniform.c', 'src/gl/vertexattrib.c', 'src/gl/wrap/gl4eswraps.c', 'src/gl/wrap/gles.c',\
        \ 'src/gl/wrap/glstub.c', 'src/gl/math/matheval.c', 'src/glx/hardext.c']\nassert len(production_sources)==len(set(production_sources))==69\n\
        files={'apple_alias_adapter.h': {'sha256': '249c6638bbf6291241626fd6da188119ef46fcd0424169866e7d5b368aa79487',\
        \ 'base64': '',\
        \ 'bytes': 584}}\nfor name,row in files.items():\n    packed=base64.b64decode(row['base64'],validate=True);d=zlib.decompressobj();data=d.decompress(packed,row['bytes']+1)\n\
        \    assert len(data)==row['bytes'] and d.eof and not d.unused_data and not d.unconsumed_tail\n    assert\
        \ hashlib.sha256(data).hexdigest()==row['sha256']\n    (root/name).write_bytes(data)\nplan={'root':str(root),'source':str(source),'revision':pin,'repository':url,'developer':developer,\n\
        \  'sdk':str(sdk),'sdkVersion':sdkversion,'sdkInputs':sdkinputs,'tools':tools,'versions':versions,\n  'canonicalSourceHashes':sourcehashes,'productionSources':production_sources,'ownSourceHashes':{n:v['sha256']\
        \ for n,v in files.items()},\n  'aliasAdapter':'Two exact Apple-only typed forwarders; not function-address\
        \ alias identity',\n  'retailInputsSupplied':False,'sdkExported':False,'appCreated':False}\n(root/'plan.json').write_text(json.dumps(plan,indent=2))\n\
        print(json.dumps({'revision':pin,'versions':versions,'sdkVersion':sdkversion,'sdkInputs':sdkinputs,'ownSourceHashes':plan['ownSourceHashes']},indent=2))\n\
        \nimport re\ninventory=json.loads(run('installed-simulator-inventory',['xcrun','simctl','list','--json']))\n\
        (root/'simulator-inventory.json').write_text(json.dumps(inventory,indent=2))\nrun('installed-spawn-help',['xcrun','simctl','help','spawn'])\n\
        runtimes=[r for r in inventory.get('runtimes',[]) if r.get('isAvailable') is True and\n  r.get('identifier','').startswith('com.apple.CoreSimulator.SimRuntime.iOS-')\
        \ and\n  int(r.get('version','0').split('.')[0])>=26]\nruntimes.sort(key=lambda r:tuple(int(v) for v in\
        \ r['version'].split('.')),reverse=True)\nchosen=None\nfor runtime in runtimes:\n    phones=[d for d in\
        \ inventory.get('devices',{}).get(runtime['identifier'],[]) if d.get('isAvailable') is True and d.get('name','').startswith('iPhone')]\n\
        \    for phone in sorted(phones,key=lambda d:d['name']):\n        kind=phone.get('deviceTypeIdentifier')\n\
        \        if not kind:\n            kinds=[d['identifier'] for d in inventory.get('devicetypes',[]) if d.get('name')==phone['name']]\n\
        \            if len(kinds)==1:kind=kinds[0]\n        if kind and kind.startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-'):\n\
        \            chosen={'runtimeIdentifier':runtime['identifier'],'runtimeVersion':runtime['version'],\n  \
        \            'runtimeBuild':runtime.get('buildversion'), 'deviceTypeIdentifier':kind,\n              'compatibilityBasis':'Already\
        \ configured available iPhone in this installed runtime',\n              'existingDeviceName':phone['name']}\n\
        \            break\n    if chosen:break\nprint(json.dumps({'installedRuntimeInventory':inventory.get('runtimes',[]),\n\
        \  'configuredDeviceInventory':inventory.get('devices',{}),'selectedInstalledRuntimeAndType':chosen},indent=2),flush=True)\n\
        assert chosen is not None,'No available already-installed iOS26+ runtime with an explicitly compatible iPhone\
        \ simulator; no platform is downloaded.'\nplan.update(simulatorSelection=chosen,simulatorTarget='arm64-apple-ios26.0-simulator',\n\
        \  deviceArchiveReused=False,simulatorPlatformDownloaded=False)\n(root/'plan.json').write_text(json.dumps(plan,indent=2))\n\
        \nPY\n"
    - name: Materialize version4 header_sources
      id: header_sources
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,zlib,pathlib\nroot=pathlib.Path('.work/cod-gl-v5-functional').absolute()\n\
        plan=json.loads((root/'plan.json').read_text())\nfiles={'cod_gl_dispatch.h': {'sha256': '59dc64f22925541be9a0403b9ab07ca35c870910727c7391a30900a48789e1a9',\
        \ 'base64': '',\
        \ 'bytes': 6019}}\n\nfor name,row in files.items():\n    packed=base64.b64decode(row['base64'],validate=True);d=zlib.decompressobj();b=d.decompress(packed,row['bytes']+1)\n\
        \    assert len(b)==row['bytes'] and d.eof and not d.unused_data and not d.unconsumed_tail\n    assert hashlib.sha256(b).hexdigest()==row['sha256']\n\
        \    (root/name).write_bytes(b);plan['ownSourceHashes'][name]=row['sha256']\n(root/'plan.json').write_text(json.dumps(plan,indent=2))\n\
        print(json.dumps({'ownPlatformSourceHashes':{n:v['sha256'] for n,v in files.items()},\n  'retailSourceIncluded':False,'purpose':'Actual\
        \ source-evidenced native CoD GL boundary and UIKit/EAGL lifecycle SDK link'},indent=2))\n\nPY\n"
    - name: Materialize version4 dispatch_source
      id: dispatch_source
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,zlib,pathlib\nroot=pathlib.Path('.work/cod-gl-v5-functional').absolute()\n\
        plan=json.loads((root/'plan.json').read_text())\nfiles={'cod_gl_dispatch.c': {'sha256': 'c29fef8603175703ddd8fcba1dfec33eefb9bce3193176cea477e9ca52d4039d',\
