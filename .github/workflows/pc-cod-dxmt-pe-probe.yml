    - name: "Inspect all PE machines builtins exports imports and complete resource sets"
      id: "inspect"
      shell: "bash"
      run: |
        set -euo pipefail
        cd source
        root="$PWD/.work/cod-dxmt-pe"
        export TMPDIR="$root/tmp"
        "$root/venv/bin/python" - <<'PY'
        import hashlib,json,pathlib,re,subprocess,pefile
        repo=pathlib.Path.cwd();root=repo/'.work/cod-dxmt-pe'
        m=root/'inputs/llvm-mingw-20260922-ucrt-macos-universal';readobj=m/'bin/llvm-readobj'
        required={'d3d11.dll':{'D3D11CoreCreateDevice','D3D11CreateDevice','D3D11CreateDeviceAndSwapChain','D3D11On12CreateDevice'},
                  'dxgi.dll':{'CreateDXGIFactory','CreateDXGIFactory1','CreateDXGIFactory2','DXGIGetDebugInterface1'},
                  'd3d10core.dll':{'D3D10CoreCreateDevice','D3D10CoreRegisterLayers'},
                  'winemetal.dll':{'SM50Initialize','SM50Compile','MadeiraCtl','MTLDevice_newLibraryWithSource'}}
        result={}
        def inspect(path,machine,builtin=False,exports=()):
         data=path.read_bytes();image=pefile.PE(data=data)
         header=subprocess.check_output([str(readobj),'--file-headers','--coff-load-config',str(path)],text=True)
         assert 'Machine: IMAGE_FILE_MACHINE_'+machine+' ' in header,(path,header)
         assert not any(section.Name.startswith(b'.debug_') for section in image.sections),path
         assert image.FILE_HEADER.TimeDateStamp==0,(path,image.FILE_HEADER.TimeDateStamp)
         if builtin:assert b'Wine builtin DLL' in data[:256],path
         names={e.name.decode() for e in image.DIRECTORY_ENTRY_EXPORT.symbols if e.name} if hasattr(image,'DIRECTORY_ENTRY_EXPORT') else set()
         assert set(exports)<=names,(path,set(exports)-names)
         imports={entry.dll.decode().lower() for attr in ('DIRECTORY_ENTRY_IMPORT','DIRECTORY_ENTRY_DELAY_IMPORT')
                  for entry in getattr(image,attr,[])}
         if machine=='ARM64EC':
          assert image.FILE_HEADER.Machine in (0x8664,0xa641),(path,image.FILE_HEADER.Machine)
          if image.FILE_HEADER.Machine==0x8664:
           pointer=getattr(image.DIRECTORY_ENTRY_LOAD_CONFIG.struct,'CHPEMetadataPointer',0)
           rva=pointer-image.OPTIONAL_HEADER.ImageBase
           assert pointer and 0<rva<image.OPTIONAL_HEADER.SizeOfImage and len(image.get_data(rva,4))==4,(path,pointer)
         record={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'machine':machine,
                 'raw_machine':hex(image.FILE_HEADER.Machine),'imports':sorted(imports),'exports':sorted(names)}
         result[str(path.relative_to(root))]=record
         return imports
        for arch,machine in [('aarch64','ARM64'),('arm64ec','ARM64EC')]:
         directory=root/'pe'/(arch+'-windows')
         assert {p.name for p in directory.glob('*.dll')}==set(required)
         for name,exports in required.items():inspect(directory/name,machine,True,exports)
        for arch,machine,expected in [
         ('arm64ec','ARM64EC',{'d3d8.dll','d3d9.dll','d3d10core.dll','d3d11.dll','dxgi.dll','d3d12.dll','d3d12core.dll'}),
         ('i386','I386',{'d3d9.dll','d3d10core.dll','d3d11.dll','dxgi.dll'})]:
         directory=root/'vulkan/pe'/(arch+'-windows')
         assert {p.name for p in directory.glob('*.dll')}==expected,(arch,sorted(p.name for p in directory.glob('*.dll')))
         for path in sorted(directory.glob('*.dll')):inspect(path,machine,True)
        for name in ('playport-session.exe','playport-url-opener.exe'):
         imports=inspect(root/'session'/name,'AMD64')
         assert imports<={'kernel32.dll','user32.dll'},(name,imports)
        assert len(result)==21,len(result)
        for path,record in result.items():print(path,json.dumps(record),flush=True)
        (root/'result.json').write_text(json.dumps({'files':result,'dxmt_abi':json.loads((root/'dxmt-abi.json').read_text()),
         'scope':'full DXMT PE/Vulkan stock resource sets and helpers; no full Wine production rebuild, app link or execution'},indent=2))
        for tree,count,pin in [('wine',231,'455e3509b98a6919fd4ad1def4803e08c41c03b2'),
         ('dxmt',54,'68af85e96196e1cf9f50de9fe24c70f03a1db4a7'),
         ('vulkan/dxvk',5,'e5ffd0fe5e5d62e68b2831d1285b51e61bb454d8'),
         ('vulkan/vkd3d-proton',4,'31d1f89ca5b3f2fd3b6f025c8e6f73ed3eaa852b')]:
         assert subprocess.check_output(['git','-C',str(root/tree),'rev-parse',f'HEAD~{count}'],text=True).strip()==pin
         subprocess.run(['git','-C',str(root/tree),'diff','--exit-code','--ignore-submodules=all','HEAD'],check=True)
        subprocess.run(['git','diff','--exit-code','HEAD'],check=True)
        print('PASS: all 21 PE resources inspected, including both complete DXMT sets and matching 150-slot source identity. No app or gameplay claim.')
        PY
