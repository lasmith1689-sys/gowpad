name: Generic native host OS Apple SDK and ARM64 proof
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-host-os-sdk-probe-20261026
    paths:
    - .github/workflows/native-host-os-sdk-probe.yml
permissions:
  contents: read
concurrency:
  group: native-host-os-sdk-v1
  cancel-in-progress: false
jobs:
  native-os:
    if: github.repository == 'lasmith1689-sys/gowpad' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-host-os-sdk-probe-20261026' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - name: Require isolated public generic-source context
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,pathlib,re\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/gowpad' and os.environ['GITHUB_REF']=='refs/heads/codex/native-host-os-sdk-probe-20261026'\nassert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')\nassert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\nassert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/gowpad'\nif os.environ['GITHUB_EVENT_NAME']=='push':\n assert event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nroot=pathlib.Path('.work/native-host-os-sdk-v1').absolute()\nassert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))\n(root/'chunks').mkdir(parents=True)\nprint('Generic OS source and synthetic fixtures only; no private engine inputs, secrets, artifacts or SDK export.')\n\nPY\n"
    - name: Stage own generic source fragment 1
      id: stage0
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-host-os-sdk-v1/chunks/0000.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own generic source fragment 2
      id: stage1
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-host-os-sdk-v1/chunks/0001.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Authenticate exact complete generic source closure
      id: assemble
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,zlib\nroot=pathlib.Path('.work/native-host-os-sdk-v1').absolute();source=root/'source'\nassert root.is_dir() and not source.exists() and not root.is_symlink()\nparts=sorted((root/'chunks').glob('*.b64'));assert [p.name for p in parts]==['0000.b64', '0001.b64']\npacked=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)\nassert len(packed)==13871 and hashlib.sha256(packed).hexdigest()=='a72a1059320ef0f34ee4cff78e3d9137bf815bea5e2810df521f0d03384d6dcf'\nd=zlib.decompressobj();data=d.decompress(packed,35743)\nassert len(data)==35742 and d.eof and not d.unused_data and not d.unconsumed_tail\nrows=json.loads(data);manifest={'native_host_os_v3.c': {'bytes': 5923, 'sha256': 'ddca480e3a913fc4fc20845f5f4e8510c0f9d4f52bf2f15e877b7010bd51d250'}, 'native_host_os_v3.h': {'bytes': 896, 'sha256': '1acf077ba010562593533613b357c8c8529ff266d7ed8b961a05b58b2c7efdaf'}, 'macho.py': {'bytes': 3138, 'sha256':\
        \ 'c88bc3ab0bbd1d459ba125ff3758d789d62df9666ce994fef516e4a67c26677d'}, 'probe_os_sdk.c': {'bytes': 8510, 'sha256': 'a365e3ead5d1f8dad269ef7c22ed270ec719fda06a90728bc88eb86605076a2e'}, 'run_sdk.py': {'bytes': 8252, 'sha256': '8f015515665375f328d4ac50355a58ff5d21da0112c04e85fe7f5002f2d2df0b'}};assert set(rows)==set(manifest)\ndecoded={}\nfor name,row in manifest.items():\n assert name==pathlib.PurePosixPath(name).name and '/' not in name and chr(92) not in name\n b=base64.b64decode(rows[name],validate=True);assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\n decoded[name]=b\nsource.mkdir()\nfor name,b in decoded.items():(source/name).write_bytes(b)\n(root/'source-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+chr(10))\nprint(json.dumps({'sourceFiles':len(manifest),'sourceHashes':{n:r['sha256'] for n,r in manifest.items()},'gameInputsIncluded':False}))\n\nPY\n"
    - name: Actual native Mac ARM64 tests and unsigned iPhone SDK library
      id: build
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib,subprocess,sys

        root=pathlib.Path(''.work/native-host-os-sdk-v1'').absolute()

        p=subprocess.run([sys.executable,str(root/''source/run_sdk.py'')],cwd=root,timeout=540)

        assert p.returncode==0,''Actual SDK and native fixture gates must pass''

        PY

        '
    - name: Require actual outcomes and unchanged source hashes
      id: final
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,pathlib\nroot=pathlib.Path('.work/native-host-os-sdk-v1').absolute();manifest=json.loads((root/'source-closure.json').read_text())\nfor n,row in manifest.items():\n b=(root/'source'/n).read_bytes();assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\np=root/'output/result.json';r=json.loads(p.read_text());assert r['status']=='passed'\nassert r['sourceHashes']=={n:v['sha256'] for n,v in manifest.items()}\na=r['actualNativeMacARM64'];page=a['pageBytes'];assert type(page) is int and 0<page<=65536 and not page&(page-1)\nassert a=={'pageBytes':page,'committedBytes':5*page,'status':'passed','failureLine':0,'permissionChecks':9,'negativeChecks':26,'workers':4,'increments':12000,'hashVectors':4,'iPhoneMemoryExecuted':False}\nassert r['versions']['iphoneSDK']=='27.1' and r['iosMetadata']['cpu']=='ARM64'\nassert r['iosMetadata']['codeSignatures']==0 and r['iosMetadata']['dependencies']==['/usr/lib/libSystem.B.dylib']\n\
        for n in ('productionGenericDarwinBackendCompiled','macKernelChosen4GiBReservationTested','macRealFourThreadMutexTested','hostAutomaticLinkerAdHocOnly'):assert r[n] is True\nfor n in ('iPhone4GiBAllocationTested','physicalIPhoneExecuted','originalImageBytesOrGameCodeIncluded','fullGameClaimed','externalSignerInvoked','SDKExported','artifactsUploaded'):assert r[n] is False\nprint(json.dumps({'status':'passed','resultSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'iosLibrarySha256':r['iosLibrarySha256'],'macExecutableSha256':r['macExecutableSha256'],'iPhoneMemoryTested':False,'gameInputsIncluded':False}))\n\nPY\n"
