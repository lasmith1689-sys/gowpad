                  'auditSha256': hashlib.sha256((obj / (name + '.prelink-audit.json')).read_bytes()).hexdigest(),
                  'retainedD': row['retainedD'], 'rawArguments': row['rawArguments'], 'adaptedArguments': row['adaptedArguments'],
                  'inputs': [{key: item[key] for key in ('path', 'sha256', 'commonCount')} for item in row['inputs']],
                  'selectedObjects': row['selectedObjects'], 'commonAllocations': row['commonAllocations'],
                  'outputSha256': row['output']['sha256'], 'outputCommonCount': row['output']['commonCount'],
                  'publicDefinitionCount': len(row['publicDefinitions']), 'linkerSha256': row['linkerSha256'],
                  'linkerStdout': row['linkerStdout'], 'linkerStderr': row['linkerStderr'],
              } for name, row in zip(('prelinked.o', final_object), audits)]
          record['nativePrelinkAudits'] = prelinks
          for path in paths:
              assert path.is_file() and path.stat().st_size > 0
              assert out('xcrun', 'lipo', '-archs', path).split() == ['arm64']
              members = out('llvm-ar', 't', path).splitlines()
              assert len(members) == 1, (path.name, members)
              heads = out('llvm-objdump', '--macho', '--private-headers', path)
              assert 'ARM64' in heads and 'LC_VERSION_MIN_MACOSX' not in heads
              platforms = re.findall(r'\bplatform\s+(\S+)', heads)
              assert platforms and all(p.lower() in ('ios', '2') for p in platforms), (path, platforms)
              defined = set(out('llvm-nm', '-g', '--defined-only', '-j', path).splitlines())
              defined = {s for s in defined if s.startswith('_')}
              assert defined == exports[path.name], (path.name, sorted(defined))
              imports = sorted({s for s in out('llvm-nm', '-u', '-j', path).splitlines() if s.startswith('_')})
              assert imports
              data = path.read_bytes()
              for forbidden in (str(pathlib.Path.cwd()).encode(), str(pathlib.Path.home()).encode(), str(root).encode()):
                  assert forbidden not in data, (path.name, 'runner path embedded')
              record[path.name] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data),
                                   'members': members, 'defined': sorted(defined), 'imports': imports,
                                   'minos': sorted(set(re.findall(r'\bminos\s+(\S+)', heads)))}
          symbols = out('llvm-nm', root / 'gstreamer/obj/winegstreamer_unix.o')
          recipe = pathlib.Path('build/stages/gstreamer.sh').read_text()
          plugins = re.search(r'PLUGINS="([^"]+)"', recipe, re.S).group(1).split()
          assert len(plugins) == 20
          for plugin in plugins:
              assert re.search(r' _gst_plugin_' + re.escape(plugin) + r'_get_desc$', symbols, re.M), plugin
          assert '_rust_eh_personality' not in record['libidevice_ffi.a']['defined']
          record['mediaPlugins'] = plugins
          record['scope'] = 'native object architecture/platform/export gate and honest static import inventory; media Wine/app hooks require the later complete app link'
          (root / 'archive-inventory.json').write_text(json.dumps(record, indent=2))
          print(json.dumps(record, indent=2))
          PY
