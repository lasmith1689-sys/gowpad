          record = {'source': '32287268fa5824f9edce4cb359f5833ce0cf7b00', 'componentZipSha256': '806664393770c68e75f2b6429955bfdd88cfaad09fec2ba70f8ed615ff90c060',
                    'frameworkBinarySha256': binary_sha, 'deviceSlice': item, 'frameworkInfo': expected,
                    'interfaceFiles': [str(path.relative_to(fw)) for path in interfaces],
                    'binaryIsSourceBuiltByThisProbe': False}
          (root / 'stikjit-component.json').write_text(json.dumps(record, indent=2))
          print(json.dumps(record, indent=2))
          PY
      - name: "Link original Relaunch against real idevice and audit SDK imports"
