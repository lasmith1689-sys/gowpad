                  audits.append(row)
              assert len(audits[1]['inputs']) == 1 and audits[1]['inputs'][0]['sha256'] == audits[0]['output']['sha256']
              assert hashlib.sha256((obj / final_object).read_bytes()).hexdigest() == audits[1]['output']['sha256']
              prelinks[component] = [{
