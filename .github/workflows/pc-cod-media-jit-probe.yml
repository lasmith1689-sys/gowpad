      - name: "Generate matching Wine headers without production PE targets"
        id: "headers"
        shell: bash
        run: |
          set -euo pipefail
          cd source
          export TMPDIR="$PWD/.work/cod-media-jit/tmp"
          mkdir -p "$TMPDIR"
          root="$PWD/.work/cod-media-jit"
          wine="$root/wine"
          mingw="$root/inputs/llvm-mingw-20260922-ucrt-macos-universal"
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix gettext)/bin:$PATH"
          mkdir -p "$wine/build-macos"
          macsdk="$(xcrun --sdk macosx --show-sdk-path)"
          macld="$(xcrun --sdk macosx --find ld)"
          # Pinned Wine configure rejects --without-mingw on aarch64 Darwin. Supply the matched PE compiler.
          # No all-target make is used: only concrete generated include/*.h targets below are built.
          (cd "$wine/build-macos" && \
            CC="xcrun --sdk macosx clang" CXX="xcrun --sdk macosx clang++" \
            OBJC="xcrun --sdk macosx clang -x objective-c" \
            AR="$(xcrun --sdk macosx --find ar)" RANLIB="$(xcrun --sdk macosx --find ranlib)" \
            LDFLAGS="-isysroot $macsdk -fuse-ld=$macld" \
            ../configure --enable-archs=aarch64 --with-mingw="$mingw/bin/clang" \
              --without-x --without-freetype --without-gnutls --without-gstreamer --disable-tests) || {
                tail -n 160 "$wine/build-macos/config.log" || true
                exit 1
              }
          python3 - <<'PY'
          import hashlib, pathlib, re, subprocess
          root = pathlib.Path('.work/cod-media-jit').resolve()
          build = root / 'wine/build-macos'
          text = (build / 'Makefile').read_text().replace('\\\n', ' ')
          targets = set()
          for line in text.splitlines():
              if line.startswith(('\t', '#')) or ':' not in line:
                  continue
              for name in line.split(':', 1)[0].split():
                  if re.fullmatch(r'include/[A-Za-z0-9_./-]+\.h', name):
                      targets.add(name)
          # dshow.h is a tracked umbrella header, not a standalone generated Make target.
          dshow = root / 'wine/include/dshow.h'
          assert dshow.is_file(), 'Missing tracked Wine DirectShow umbrella header'
          required = {'include/mfobjects.h', 'include/mftransform.h'}
          assert required <= targets, ('Missing actual generated media-header targets', sorted(required - targets))
          print('Tracked dshow.h SHA256:', hashlib.sha256(dshow.read_bytes()).hexdigest())
          print('Building', len(targets), 'actual Wine generated-header targets.', flush=True)
          subprocess.run(['make', '-C', str(build), '-j3', *sorted(targets)], check=True)
          config = build / 'include/config.h'
          print('Generated Wine config SHA256:', hashlib.sha256(config.read_bytes()).hexdigest())
          (root / 'headers.txt').write_text('\n'.join(sorted(targets)) + '\n')
          PY
