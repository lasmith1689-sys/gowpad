      - name: "Create attested native prelink and selected COMMON allocation auditor"
        id: "prelink_adapter"
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 - <<'PY'
          import hashlib, json, pathlib, re, sys
          repo = pathlib.Path.cwd()
          root = repo / '.work/cod-media-jit'
          adapter = root / 'adapter'
          adapter.mkdir(parents=True)
          tools = json.loads((root / 'tools.json').read_text())
          native_root = repo.parent / '.work/native-ld64-source'
          source_inventory = native_root / 'source-build-inventory.json'
          semantic_proof = native_root / 'common-visibility-proof.json'
          inventory = json.loads(source_inventory.read_text())
          proof = json.loads(semantic_proof.read_text())
          assert inventory['status'] == proof['status'] == 'passed'
          assert inventory['sourceRevision'] == '904de2a71d4da6a9b30d2efaf912a10ddc7d9ddb'
          private_linker = pathlib.Path(inventory['linker'])
          assert private_linker.is_absolute() and private_linker.is_relative_to(native_root / 'prefix')
          assert hashlib.sha256(private_linker.read_bytes()).hexdigest() == inventory['linkerSha256'] == proof['linkerSha256']
          assert proof['tools']['sdk'] == tools['sdk'] and proof['tools']['sdkVersion'] == tools['version']
          # The exact private source build and two-pass proof must pass first.
          # Keep -d and every semantic flag; add only archive-selection diagnostics.
          # Cargo and final native links retain the selected Apple linker.
          prelink_evidence = {
              'appleMan': {'url': 'https://github.com/apple-oss-distributions/ld64/blob/main/doc/man/man1/ld-classic.1',
                           'gitBlob': '257ffde35eacb8914648618acc357a88aa948270', 'lines': [410, 416]},
              'appleOptions': {'url': 'https://github.com/apple-oss-distributions/ld64/blob/main/src/ld/Options.cpp',
                               'gitBlob': '4b3020dd0c91333f563cfcd45ba9176c0cab538c', 'lines': [3543, 3544]},
              'llvmNm': {'url': 'https://github.com/llvm/llvm-project/blob/llvmorg-22.1.0/llvm/docs/CommandGuide/llvm-nm.rst',
                         'gitBlob': '7067bb0a29a195ba5f1f2d166b770a0b25f2b246',
                         'printerBlob': 'dcfc0f92590d5abb09c10d8d27c023125c62d99f', 'machOReaderBlob': 'e09d07f9020ef7940b557ba3bd84a5907f5646cf'},
              'archiveSelection': {'url': 'https://github.com/tpoechtrager/cctools-port/blob/904de2a71d4da6a9b30d2efaf912a10ddc7d9ddb/cctools/ld64/src/ld/parsers/archive_file.cpp',
                                   'gitBlob': 'ad728d71cf2629c10930d53b3f58cea530dc83ed'},
          }
          prelink_wrapper = r'''import hashlib, json, pathlib, re, struct, subprocess, sys

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def object_header(data, name):
              assert len(data) >= 32, 'Truncated native input: ' + name
              fields = struct.unpack_from('<8I', data)
              assert fields[0] == 0xfeedfacf and fields[1] == 0x0100000c and fields[3] == 1, 'Unsupported native object: ' + name
              assert 32 + fields[5] <= len(data), 'Truncated Mach-O commands: ' + name
              sections, symbols, empty_debug, table, position = [], [], [], None, 32
              for unused in range(fields[4]):
                  assert position + 8 <= 32 + fields[5]
                  command, size = struct.unpack_from('<II', data, position)
                  assert size >= 8 and position + size <= 32 + fields[5]
                  if command == 0x19:
                      assert size >= 72
                      count = struct.unpack_from('<I', data, position + 64)[0]
                      assert 72 + 80 * count <= size
                      for index in range(count):
                          values = struct.unpack_from('<16s16sQQIIIIIIII', data, position + 72 + index * 80)
                          sections.append({'address': values[2], 'size': values[3], 'alignment': values[5], 'flags': values[8]})
                  elif command == 2:
                      assert size == 24 and table is None
                      table = struct.unpack_from('<IIII', data, position + 8)
                  position += size
              assert position == 32 + fields[5]
              if table:
                  offset, count, string_offset, string_size = table
                  assert offset + 16 * count <= len(data) and string_offset + string_size <= len(data)
                  strings = data[string_offset:string_offset + string_size]
                  for index in range(count):
                      string, kind, section, description, value = struct.unpack_from('<IBBHQ', data, offset + index * 16)
                      assert string < len(strings)
                      end = strings.find(bytes([0]), string)
                      assert end >= string
                      if kind & 0xe0:
                          if end == string:
                              empty_debug.append({'type': kind, 'section': section, 'description': description, 'value': value})
                          continue
                      symbols.append({'name': strings[string:end].decode(), 'type': kind, 'section': section,
                                      'description': description, 'value': value})
              commons = [row for row in symbols if row['type'] & 0x0e == 0 and row['value'] > 0]
              return {'sections': sections, 'symbols': symbols, 'commons': commons, 'emptyDebugSymbols': empty_debug}

          def inspect_native_input(path):
              data = path.read_bytes()
              result = {'path': str(path), 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
              if data[:8] != b'!<arch>\n':
                  result['native'] = object_header(data, str(path))
                  result['format'] = 'arm64-Mach-O-MH_OBJECT'
                  return result
              members = []
              position = 8
              strings = b''
              while position < len(data):
                  member_offset = position
                  assert position + 60 <= len(data), 'Truncated archive header'
                  header = data[position:position + 60]
                  assert header[58:60] == b'`\n', 'Invalid archive header'
                  assert re.fullmatch(rb'[0-9]+ *', header[48:58]), 'Invalid archive size'
                  size = int(header[48:58])
                  position += 60
                  assert position + size <= len(data), 'Truncated archive member'
                  payload = data[position:position + size]
                  position += size + (size % 2)
                  assert position <= len(data), 'Missing archive alignment byte'
                  name = header[:16].decode('ascii').rstrip()
                  if name.startswith('#1/'):
                      assert name[3:].isdigit(), 'Invalid BSD archive name length'
                      count = int(name[3:])
                      assert 0 < count <= len(payload), 'Truncated BSD archive name'
                      name = payload[:count].rstrip(bytes([0])).decode('utf-8')
                      payload = payload[count:]
                  elif name == '//':
                      strings = payload
                      continue
                  elif name.startswith('/') and name[1:].isdigit():
                      offset = int(name[1:])
                      end = strings.find(b'/\n', offset)
                      assert 0 <= offset < end, 'Invalid GNU archive string reference'
                      name = strings[offset:end].decode('utf-8')
                  elif name not in ('/', '/SYM64/'):
                      name = name.removesuffix('/')
                  if name in ('/', '/SYM64/', '__.SYMDEF', '__.SYMDEF SORTED', '__.SYMDEF_64', '__.SYMDEF_64 SORTED'):
                      continue
                  native = object_header(payload, str(path) + '[' + name + ']')
                  members.append({'name': name, 'offset': member_offset, 'native': native,
                                  'bytes': len(payload), 'sha256': hashlib.sha256(payload).hexdigest()})
              assert position == len(data) and members, 'Empty or malformed native archive'
              result.update(format='archive-of-arm64-Mach-O-MH_OBJECT', members=members)
              return result

          def parse_arguments(arguments, config):
              widths = {'-arch': 1, '-platform_version': 3, '-syslibroot': 1, '-o': 1,
                        '-u': 1, '-exported_symbol': 1, '-unexported_symbol': 1,
                        '-exported_symbols_list': 1, '-unexported_symbols_list': 1, '-force_load': 1}
              flags = {'-r', '-d', '-S', '-keep_private_externs', '-all_load'}
              options, inputs, auxiliary, adapted = {}, [], [], []
              position = 0
              while position < len(arguments):
                  token = arguments[position]
                  if token in flags:
                      options.setdefault(token, []).append([])
                      adapted.append(token)
                      position += 1
                  elif token in widths:
                      width = widths[token]
                      values = arguments[position + 1:position + 1 + width]
                      assert len(values) == width and all(value and not value.startswith(('-', '@')) for value in values), 'Invalid prelink option value'
                      options.setdefault(token, []).append(values)
                      adapted.extend([token, *values])
                      position += 1 + width
                      if token == '-force_load':
                          inputs.append(pathlib.Path(values[0]))
                      elif token in ('-exported_symbols_list', '-unexported_symbols_list'):
                          auxiliary.append(pathlib.Path(values[0]))
                  else:
                      assert not token.startswith(('-', '@')), 'Unsupported or hidden prelink input: ' + token
                      inputs.append(pathlib.Path(token))
                      adapted.append(token)
                      position += 1
              assert options.get('-r') == [[]] and len(options.get('-d', [])) <= 1, 'Only a single relocatable prelink is supported'
              assert options.get('-arch') == [['arm64']], 'Unverified prelink architecture'
              assert options.get('-platform_version') == [['ios', '17.0', config['sdkVersion']]], 'Unverified prelink platform'
              assert options.get('-syslibroot') == [[config['sdk']]], 'Unverified prelink SDK'
              assert len(options.get('-o', [])) == 1, 'Exactly one prelink output required'
              output = pathlib.Path(options['-o'][0][0])
              assert output.is_absolute() and output.suffix == '.o' and output.resolve().is_relative_to(pathlib.Path(config['root']).resolve()), 'Output outside private probe'
              assert inputs and all(path.is_absolute() and path.is_file() and path.suffix in ('.o', '.a') and path.resolve() != output.resolve() for path in inputs), 'Unsupported prelink input path'
              assert all(path.is_absolute() and path.is_file() for path in auxiliary), 'Unsupported symbol-list path'
              return output, inputs, auxiliary, adapted

          def audit_symbols(path, nm, record):
              command = [nm, '--no-llvm-bc', '--quiet', '--no-demangle', '--debug-syms', '--special-syms', '--no-sort', '--print-file-name', '--format=posix', str(path)]
              result = subprocess.run(command, capture_output=True, text=True, check=True)
              # LLVM's POSIX printer emits archive[member]: name TYPE value size.
              # Inspect all members, all visibility, definitions and undefineds.
              pattern = re.compile(re.escape(str(path)) + r'(?:\[[^\n]+\])?: (.+) ([A-Za-z?\-]) (?:[0-9a-f]+)? +[0-9a-f]+$')
              objects, expected_debug = record.get('members', [record]), {}
              for obj in objects:
                  label = str(path) + ('[' + obj['name'] + ']' if 'members' in record else '')
                  for symbol in obj['native']['emptyDebugSymbols']:
                      line = f"{label}:  - {symbol['value']:x} 0"
                      expected_debug[line] = expected_debug.get(line, 0) + 1
              counts = {}
              for line in result.stdout.splitlines():
                  if line in expected_debug:
                      assert expected_debug[line] > 0, 'Extra empty STAB metadata: ' + line
                      expected_debug[line] -= 1
                      kind = '-'
                  else:
                      match = pattern.fullmatch(line)
                      assert match, 'Unparsed native nm output: ' + line
                      kind = match[2]
                  assert kind != '?', 'Unknown native symbol type'
                  counts[kind] = counts.get(kind, 0) + 1
              assert not any(expected_debug.values()), 'Missing empty STAB metadata in native nm output'
              record.update(nmArguments=command, nmSha256=hashlib.sha256(result.stdout.encode()).hexdigest(),
                            nmDiagnostics=result.stderr, symbolTypes=counts,
                            commonCount=counts.get('C', 0) + counts.get('c', 0))
              assert record['commonCount'] == sum(len(obj['native']['commons']) for obj in objects), 'Native nm/raw COMMON count disagreement'
              assert not result.stderr, 'Native nm diagnostic requires review: ' + result.stderr
              assert digest(path) == record['sha256'], 'Input changed during native inspection'

          def selected_objects(trace, inputs, arguments):
              selected = {row['path']: {'identity': row['path'], 'native': row['native']} for row in inputs if 'native' in row}
              for line in trace.splitlines():
                  reason, marker, loaded = line.partition('forced load of ')
                  assert marker, 'Unparsed native archive selection: ' + line
                  matches = [(row, member) for row in inputs for member in row.get('members', [])
                             if loaded == row['path'] + '(' + member['name'] + ')']
                  assert matches, 'Unknown native archive selection: ' + loaded
                  if len(matches) > 1:
                      force = '-all_load' in arguments or any(arguments[i:i + 2] == ['-force_load', matches[0][0]['path']] for i in range(len(arguments)))
                      if not force:
                          matches = [(row, member) for row, member in matches if any(symbol['name'] == reason.strip() for symbol in member['native']['symbols'])]
                          assert len(matches) == 1, 'Ambiguous duplicate archive member identity: ' + loaded
                  for row, member in matches:
                      identity = row['path'] + ':' + str(member.get('offset', member['name'])) + ':' + member['name']
                      selected[identity] = {'identity': identity, 'native': member['native']}
              return list(selected.values())

          def common_allocations(selected, output):
              common, concrete = {}, set()
              for obj in selected:
                  for symbol in obj['native']['symbols']:
                      if symbol['type'] & 0x0e in (2, 0x0e) and not symbol['description'] & 0x80 and symbol['type'] & 1:
                          concrete.add(symbol['name'])
                  for symbol in obj['native']['commons']:
                      row = common.setdefault(symbol['name'], {'name': symbol['name'], 'requiredBytes': 0, 'requiredAlignment': 1, 'sources': []})
                      row['requiredBytes'] = max(row['requiredBytes'], symbol['value'])
                      row['requiredAlignment'] = max(row['requiredAlignment'], 1 << ((symbol['description'] >> 8) & 15))
                      row['sources'].append(obj['identity'])
              resolutions = []
              for name, row in common.items():
                  candidates = [symbol for symbol in output['symbols'] if symbol['name'] == name and symbol['type'] & 0x0e in (2, 0x0e)]
                  external = [symbol for symbol in candidates if symbol['type'] & 1]
                  candidates = external or candidates
                  if not candidates:
                      row['resolution'] = 'not-emitted-after-coalescing'
                  elif name in concrete:
                      row['resolution'] = 'strong-override'
                  else:
                      assert len(candidates) == 1, 'Ambiguous emitted COMMON definition: ' + name
                      symbol = candidates[0]
                      assert symbol['type'] & 0x0e == 0x0e and 0 < symbol['section'] <= len(output['sections']), 'COMMON was not allocated: ' + name
                      section = output['sections'][symbol['section'] - 1]
                      assert section['flags'] & 0xff in (1, 12), 'COMMON allocation is not zero-fill: ' + name
                      boundary = min([section['address'] + section['size']] + [other['value'] for other in output['symbols']
                                     if other['name'] in common and other['section'] == symbol['section'] and other['value'] > symbol['value']])
                      assert section['address'] <= symbol['value'] and symbol['value'] + row['requiredBytes'] <= boundary, 'Insufficient COMMON allocation: ' + name
                      assert (1 << section['alignment']) >= row['requiredAlignment'] and symbol['value'] % row['requiredAlignment'] == 0, 'Insufficient COMMON alignment: ' + name
                      row.update(resolution='allocated-common', outputAddress=symbol['value'], availableBytes=boundary - symbol['value'], outputSectionAlignment=1 << section['alignment'])
                  resolutions.append(row)
              return resolutions

          def check_visibility(arguments, output):
              import fnmatch
              public = {symbol['name'] for symbol in output['symbols'] if symbol['type'] & 1 and not symbol['type'] & 0x10 and symbol['type'] & 0x0e in (2, 0x0e)}
              exports = {arguments[i + 1] for i, value in enumerate(arguments[:-1]) if value == '-exported_symbol'}
              if exports:
                  assert public == exports, 'Native prelink exported-symbol privacy mismatch'
              hidden = [arguments[i + 1] for i, value in enumerate(arguments[:-1]) if value == '-unexported_symbol']
              for index, value in enumerate(arguments[:-1]):
                  if value == '-unexported_symbols_list':
                      hidden += [line.split('#', 1)[0].strip() for line in pathlib.Path(arguments[index + 1]).read_text().splitlines() if line.split('#', 1)[0].strip()]
              assert not any(fnmatch.fnmatchcase(name, pattern) for name in public for pattern in hidden), 'Native unexported symbol remains public'
              return sorted(public)

          def run_prelink(arguments, config):
              output, inputs, auxiliary, adapted = parse_arguments(arguments, config)
              assert not output.exists(), 'Stale native prelink output'
              assert all(pathlib.Path(config[name]).is_absolute() and pathlib.Path(config[name]).is_file() for name in ('ld', 'nm')), 'Absolute native tools required'
              assert digest(pathlib.Path(config['ld'])) == config['linkerSha256'], 'Source-built linker changed'
              for name in ('sourceInventory', 'semanticProof'):
                  path = pathlib.Path(config[name])
                  assert digest(path) == config[name + 'Sha256'] and json.loads(path.read_text())['status'] == 'passed', 'Source linker capability attestation changed'
              if any(path.suffix == '.a' for path in inputs):
                  adapted.append('-why_load')
              record = {'rawArguments': arguments, 'adaptedArguments': adapted, 'retainedD': '-d' in arguments,
                        'status': 'started', 'inputs': [], 'auxiliaryInputs': [], 'configuration': config,
                        'linkerSha256': digest(pathlib.Path(config['ld'])), 'nmToolSha256': digest(pathlib.Path(config['nm']))}
              audit = output.with_name(output.name + '.prelink-audit.json')
              try:
                  version = subprocess.run([config['nm'], '--version'], capture_output=True, text=True, check=True).stdout
                  assert re.search(r'\bversion 22\.', version), 'Unverified native LLVM nm version'
                  record['nmVersion'] = version
                  for path in inputs:
                      row = inspect_native_input(path)
                      record['inputs'].append(row)
                      audit_symbols(path, config['nm'], row)
                  record['auxiliaryInputs'] = [{'path': str(path), 'sha256': digest(path)} for path in auxiliary]
                  record['status'] = 'native-inputs-audited-original-flags-retained'
                  audit.write_text(json.dumps(record, indent=2))
                  linked = subprocess.run([config['ld'], *adapted], capture_output=True, text=True, check=False)
                  record.update(linkerStdout=linked.stdout, linkerStderr=linked.stderr)
                  assert linked.returncode == 0, 'Native prelink failed: ' + linked.stderr
                  record['output'] = inspect_native_input(output)
                  audit_symbols(output, config['nm'], record['output'])
                  assert record['output']['commonCount'] == 0, 'COMMON output invalidates prelink adaptation'
                  selected = selected_objects(linked.stdout, record['inputs'], arguments)
                  record['selectedObjects'] = [obj['identity'] for obj in selected]
                  record['commonAllocations'] = common_allocations(selected, record['output']['native'])
                  record['publicDefinitions'] = check_visibility(arguments, record['output']['native'])
                  for row in record['inputs'] + record['auxiliaryInputs']:
                      assert digest(pathlib.Path(row['path'])) == row['sha256'], 'Prelink input changed'
                  record['status'] = 'passed'
              except Exception as error:
                  record.update(status='failed', error=str(error))
                  raise
              finally:
                  audit.write_text(json.dumps(record, indent=2))
                  print(json.dumps({'prelinkAudit': str(audit), 'status': record['status'], 'retainedD': record['retainedD'],
                                    'inputCommonCount': sum(row.get('commonCount', 0) for row in record['inputs']),
                                    'allocatedCommonCount': sum(row['resolution'] == 'allocated-common' for row in record.get('commonAllocations', []))}))

          if __name__ == '__main__':
              run_prelink(sys.argv[1:], json.loads(pathlib.Path(__file__).with_suffix('.json').read_text()))
          '''
          prelink = adapter / 'native-prelink.py'
          assert pathlib.Path(sys.executable).is_absolute() and not re.search(r'\s', sys.executable)
          prelink.write_text('#!' + sys.executable + '\n' + prelink_wrapper)
          prelink.chmod(0o755)
          prelink.with_suffix('.json').write_text(json.dumps({
              'root': str(root), 'sdk': tools['sdk'], 'sdkVersion': tools['version'],
              'ld': str(private_linker), 'linkerSha256': inventory['linkerSha256'],
              'sourceInventory': str(source_inventory), 'sourceInventorySha256': hashlib.sha256(source_inventory.read_bytes()).hexdigest(),
              'semanticProof': str(semantic_proof), 'semanticProofSha256': hashlib.sha256(semantic_proof.read_bytes()).hexdigest(),
              'nm': str(pathlib.Path(tools['llvm']) / 'bin/llvm-nm'),
              'semanticsEvidence': prelink_evidence,
          }, indent=2))
          PY
