name: Native SwiftPM iPhone graph toolset and entry mechanics
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/pc-games-runtime-probe-20261025
    paths:
    - .github/workflows/pc-swiftpm-ios-entry-probe.yml
permissions:
  contents: read
concurrency:
  group: pc-swiftpm-ios-entry-probe
  cancel-in-progress: false
jobs:
  swiftpm-ios-entry:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
    - name: Prepare exact reviewed mechanics and own-source local fixtures
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import ast,base64,hashlib,importlib.util,json,os,pathlib,re,subprocess,sys
        root=pathlib.Path('.work/swiftpm-ios-entry').resolve()
        assert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))
        root.mkdir(parents=True);(root/'tools').mkdir();(root/'tmp').mkdir()
        env=dict(os.environ)
        for key in tuple(env):
            if key in ('SDKROOT','SDK_NAME','SDK_VERSION','TOOLCHAINS','SWIFT_EXEC','DEVELOPER_DIR','IPHONEOS_DEPLOYMENT_TARGET','MACOSX_DEPLOYMENT_TARGET') or key.startswith(('SWIFTPM_','PLAYPORT_')):env.pop(key)
        def out(args):return subprocess.check_output(list(map(str,args)),env=env,text=True).strip()
        developer=out(['xcode-select','-p']);env.update(DEVELOPER_DIR=developer,TMPDIR=str(root/'tmp'),LC_ALL='C')
        swift=pathlib.Path(out(['xcrun','-f','swift']));version=out([swift,'--version'])
        sdk=out(['xcrun','--sdk','iphoneos','--show-sdk-path']);sdkversion=out(['xcrun','--sdk','iphoneos','--show-sdk-version'])
        assert out(['uname','-m'])=='arm64' and re.search(r'Swift version 6\.4\b',version)
        assert tuple(map(int,sdkversion.split('.')[:2]))>=(27,0)
        assert swift.is_absolute() and swift.is_file() and swift.resolve().is_relative_to(pathlib.Path(developer).resolve())
        ld=out(['xcrun','--sdk','iphoneos','--find','ld'])
        llvm=next((pathlib.Path('/opt/homebrew/opt')/name/'bin' for name in ('llvm@22','llvm@21','llvm@20','llvm')
            if all((pathlib.Path('/opt/homebrew/opt')/name/'bin'/tool).is_file() for tool in ('llvm-nm','llvm-objdump'))),None)
        assert llvm is not None,'Use existing native inspection tools; no global installation'
        value=base64.b64decode('',validate=True)
        assert hashlib.sha256(value).hexdigest()=='2a99ea30188fa7e5a756b869d76197e7d39040cb3c0826270d0d696ca1d76ded'
        ast.parse(value.decode());(root/'tools/builder-mechanics.py').write_bytes(value)
        spec=importlib.util.spec_from_file_location('mechanics',root/'tools/builder-mechanics.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
        record={'swift':str(swift),'swiftVersion':version,'developer':developer,'sdk':sdk,'sdkVersion':sdkversion,
            'appleLd':ld,'llvm':str(llvm),'xcode':out(['xcodebuild','-version']),
            'productionHelperSha256':'b962d7c0f70af1caa49f913aab246b753a685c171e0c341608ac2de854cf47da',
            'extractedHelperSha256':'2a99ea30188fa7e5a756b869d76197e7d39040cb3c0826270d0d696ca1d76ded','scope':'Own-source CLI graph/toolset/main/helper entry mechanics only'}
        (root/'toolchain.json').write_text(json.dumps(record,indent=2));print(json.dumps(record,indent=2))
        fixtures=root/'fixtures';fixtures.mkdir();leaf=fixtures/'LocalLeaf';package=fixtures/'RootPackage'
        for path in (leaf/'Sources/Leaf',package/'Sources/EntryMain',package/'Sources/EntryHelper',package/'Sources/EntryPoint/include'):path.mkdir(parents=True)
        (leaf/'Package.swift').write_text('// swift-tools-version: 6.0\nimport PackageDescription\nlet package=Package(name:"LocalLeaf",platforms:[.iOS("26.0")],products:[.library(name:"LocalLeaf",targets:["Leaf"])],targets:[.target(name:"Leaf")])\n')
        (leaf/'Sources/Leaf/Leaf.swift').write_text('public func fixtureText() -> String { "Own-source CLI entry smoke" }\n')
        (package/'Package.swift').write_text('// swift-tools-version: 6.0\nimport PackageDescription\nlet package=Package(name:"RootPackage",platforms:[.iOS("26.0")],products:[.library(name:"Playport",targets:["EntryMain"]),.library(name:"PlayportJIT",targets:["EntryHelper","EntryPoint"])],dependencies:[.package(path:"../LocalLeaf")],targets:[.target(name:"EntryMain",dependencies:[.product(name:"LocalLeaf",package:"LocalLeaf")]),.target(name:"EntryHelper",linkerSettings:[.linkedFramework("Foundation"),.unsafeFlags(["-Xlinker","-ObjC"])]),.target(name:"EntryPoint",linkerSettings:[.linkedFramework("Foundation")])])\n')
        (package/'Sources/EntryMain/PlayportApp.swift').write_text('import SwiftUI\nimport Leaf\n@main public struct EntrySmokeApp: App {\n public init() {}\n public var body: some Scene { WindowGroup { Text(fixtureText()) } }\n}\n')
        (package/'Sources/EntryHelper/Principal.swift').write_text('import Foundation\n@objc(EntrySmokePrincipal) public final class EntrySmokePrincipal: NSObject {\n @objc public func smokeValue() -> Int32 { 64 }\n}\n')
        (package/'Sources/EntryPoint/include/EntryPoint.h').write_text('int NSExtensionMain(int argc,char **argv);\n')
        (package/'Sources/EntryPoint/entry.c').write_text('#include <dlfcn.h>\n__attribute__((used,visibility("default"))) int NSExtensionMain(int argc,char **argv) {\n int (*foundation_main)(int,char **)=(int (*)(int,char **))dlsym(RTLD_NEXT,"NSExtensionMain");\n return foundation_main(argc,argv);\n}\n')
        (root/'work').mkdir();builder=root/'work/builder';builder.mkdir();(builder/'Package.swift').write_text(m.builder_package(package))
        for target in ('Playport-App','PlayportJIT-Extension'):
            path=builder/'Sources'/target;path.mkdir(parents=True);(path/'stub.c').write_bytes(b'')
        toolset=m.create_native_linker_adapter(root/'work',root,ld);wrapper=toolset.parent/'ld';original=wrapper.read_text()
        assert original.count('os.execv(')==1
        # Record transformed arguments before the same real Apple ld exec; no argument/code-generation change.
        audit="import json\nwith open("+repr(str(root/'linker-invocations.jsonl'))+",'a') as audit: audit.write(json.dumps(arguments)+'\\n')\nos.execv("
        wrapper.write_text(original.replace('os.execv(',audit));wrapper.chmod(0o755)
        (root/'linker-observer.json').write_text(json.dumps({'unobservedSha256':hashlib.sha256(original.encode()).hexdigest(),
            'observedSha256':hashlib.sha256(wrapper.read_bytes()).hexdigest(),'originalExecCount':1,'argumentsChangedByObservation':False},indent=2))
        inventory={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for parent in (fixtures,builder,root/'tools',root/'work/native-linker') for p in parent.rglob('*') if p.is_file()}
        assert not any(p.name.casefold()=='main.swift' for p in fixtures.rglob('*.swift')), 'Fixture must preserve library target inference'
        (root/'fixture-inventory.json').write_text(json.dumps(inventory,indent=2))
        PY
    - name: Embed frozen strict import checker without acquisition
      id: checker
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import base64,hashlib,pathlib
        root=pathlib.Path('.work/swiftpm-ios-entry').resolve()
        value=base64.b64decode('',validate=True)
        assert hashlib.sha256(value).hexdigest()=='cd155383b94a75c30876f420d27383b365503b772743540372729baf2bf032b4'
        path=root/'tools/check-macho-imports.py'
        assert not path.exists()
        path.write_bytes(value)
        PY
    - name: Exercise graph CLI then real iPhone SwiftPM toolset cross-build
      id: build
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os,pathlib,subprocess
        root=pathlib.Path('.work/swiftpm-ios-entry').resolve();t=json.loads((root/'toolchain.json').read_text())
        env=dict(os.environ)
        for key in tuple(env):
            if key in ('SDKROOT','SDK_NAME','SDK_VERSION','TOOLCHAINS','SWIFT_EXEC','DEVELOPER_DIR','IPHONEOS_DEPLOYMENT_TARGET','MACOSX_DEPLOYMENT_TARGET') or key.startswith(('SWIFTPM_','PLAYPORT_')):env.pop(key)
        env.update(DEVELOPER_DIR=t['developer'],TMPDIR=str(root/'tmp'),LC_ALL='C',PLAYPORT_VARIANT='release')
        env['PATH']=t['llvm']+os.pathsep+env.get('PATH','');swift=t['swift'];release=root/'fixtures/RootPackage';commands=[]
        def run(args,check=True):
            args=list(map(str,args));stem='command-'+str(len(commands)).zfill(2)
            stdout_log=root/(stem+'.stdout.log');stderr_log=root/(stem+'.stderr.log')
            print('COMMAND',json.dumps(args),flush=True)
            with stdout_log.open('w') as output,stderr_log.open('w') as errors:
                result=subprocess.run(args,cwd=root/'work',env=env,stdout=output,stderr=errors)
            stdout=stdout_log.read_text();stderr=stderr_log.read_text()
            print('STDOUT',stdout,'STDERR',stderr,flush=True)
            commands.append({'arguments':args,'returncode':result.returncode,
                'stdoutLog':stdout_log.name,'stdoutSha256':hashlib.sha256(stdout_log.read_bytes()).hexdigest(),
                'stderrLog':stderr_log.name,'stderrSha256':hashlib.sha256(stderr_log.read_bytes()).hexdigest()})
            if check:assert result.returncode==0,'Exact CLI command failed: '+json.dumps(args)
            return result.returncode,stdout,stderr
        def parse_bin_path(stdout,scratch):
            path=pathlib.Path(stdout.strip()).resolve(strict=True)
            assert path.is_relative_to(scratch.resolve(strict=True))
            return path
        def package_args(path):
            return [swift,'package','--configuration','release','--build-system','native','--swift-sdk','arm64-apple-ios',
                '--package-path',str(path),'--cache-path',str(root/'work/swiftpm-cache'),'--config-path',str(root/'work/swiftpm-config'),
                '--scratch-path',str(root/'work/package-scratch'/path.name)]
        run(package_args(release)+['resolve'])
        graph=root/'dependencies.json';run(package_args(release)+['-q','show-dependencies','--format','json','-o',str(graph)])
        dependencies=json.loads(graph.read_text());descriptions={};paths={}
        def visit(row):
            identity=row['identity'];path=pathlib.Path(row['path']).resolve()
            assert path.is_relative_to(root/'fixtures') and path.is_dir()
            if identity in paths:assert paths[identity]==str(path);return
            paths[identity]=str(path)
            _,text,_=run(package_args(path)+['-q','describe','--type','json'])
            descriptions[identity]=json.loads(text[text.index('{'):])
            for child in row.get('dependencies',[]):visit(child)
        visit(dependencies)
        assert len(paths)==2 and set(pathlib.Path(p).name for p in paths.values())=={'RootPackage','LocalLeaf'}
        products={p['name']:p for p in descriptions[dependencies['identity']]['products']}
        assert set(products)=={'Playport','PlayportJIT'} and all(p['type']=={'library':['automatic']} for p in products.values())
        args=[swift,'build','--configuration','release','--build-system','native','--swift-sdk','arm64-apple-ios',
            '--package-path',str(root/'work/builder'),'--scratch-path',str(root/'work/scratch'),'--disable-automatic-resolution',
            '--cache-path',str(root/'work/swiftpm-cache'),'--config-path',str(root/'work/swiftpm-config'),'--toolset',str(root/'work/native-linker/toolset.json')]
        for original,replacement in ((str(root),'playport-source'),(str(root/'work'),'playport-builder')):
            args+=['-Xswiftc','-debug-prefix-map','-Xswiftc',original+'='+replacement,'-Xswiftc','-file-prefix-map','-Xswiftc',original+'='+replacement,
                '-Xcc','-ffile-prefix-map='+original+'='+replacement,'-Xcc','-fdebug-prefix-map='+original+'='+replacement]
        # First test production sequence unchanged: only the library root was resolved.
        status,stdout,stderr=run(args,check=False);text=stdout+stderr;needed=False
        if status:
            assert ('automatic dependency resolution is disabled' in text and ('resolved file is required' in text or 'out-of-date resolved file' in text)),text
            needed=True
            run(package_args(root/'work/builder')+['resolve'])
            run(args)
        _,output,_=run(args+['--show-bin-path']);bin_dir=parse_bin_path(output,root/'work/scratch')
        assert bin_dir.is_relative_to(root/'work/scratch')
        (root/'build-result.json').write_text(json.dumps({'commands':commands,'graph':dependencies,'descriptions':descriptions,
            'binDirectory':str(bin_dir),'buildCommand':args,'productionSequencePassedWithoutBuilderResolve':not needed,
            'builderResolveRequired':needed,'actualCompileLinkPassed':True,'targetExecuted':False,'fullPlayportCompiled':False},indent=2))
        print('Actual builder resolution required:',needed)
        PY
    - name: Inspect actual unsigned iOS ARM64 entry points and SDK imports
      id: inspect
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,importlib.util,json,os,pathlib,re,subprocess
        root=pathlib.Path('.work/swiftpm-ios-entry').resolve();t=json.loads((root/'toolchain.json').read_text())
        record=json.loads((root/'build-result.json').read_text());assert record['actualCompileLinkPassed'] is True
        helper=root/'tools/builder-mechanics.py';assert hashlib.sha256(helper.read_bytes()).hexdigest()==t['extractedHelperSha256']
        spec=importlib.util.spec_from_file_location('mechanics',helper);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
        env=dict(os.environ,DEVELOPER_DIR=t['developer'],TMPDIR=str(root/'tmp'),LC_ALL='C');env['PATH']=t['llvm']+os.pathsep+env.get('PATH','')
        invocations=[json.loads(line) for line in (root/'linker-invocations.jsonl').read_text().splitlines()]
        print(json.dumps({'phase':'before-linker-guards','actualLinkerInvocations':invocations},indent=2),flush=True)
        assert len(invocations)>=2,'Toolset did not invoke the exact native linker adapter for both executables'
        for args in invocations:
            assert args[:2]==['-oso_prefix',str(root)+'/']
            assert '-no_adhoc_codesign' in args and '-platform_version' in args
            position=args.index('-platform_version');assert args[position+1]=='ios'
            for index,arg in enumerate(args[:-1]):
                if arg in ('-rpath','-add_ast_path'):assert not (pathlib.Path(args[index+1]).is_absolute() and pathlib.Path(args[index+1]).resolve().is_relative_to(root))
        binary_directory=pathlib.Path(record['binDirectory']);proof={}
        for product,entry,required in [('Playport-App','_main',{'@executable_path/Frameworks'}),
            ('PlayportJIT-Extension','_NSExtensionMain',{'@executable_path/Frameworks','@executable_path/../../Frameworks'})]:
            path=binary_directory/product;data=path.read_bytes();metadata=m.macho(data)
            print(json.dumps({'phase':'before-image-guards','product':product,'parsedMachOMetadata':metadata,'actualLinkerInvocations':invocations,'requiredRpaths':sorted(required),'allowedRpaths':sorted(required|{'/usr/lib/swift'})},indent=2),flush=True)
            assert metadata['type']==2 and metadata['build'][1]==26<<16 and metadata['signaturePresent'] is False
            assert required<=set(metadata['rpaths'])<=required|{'/usr/lib/swift'},('Unexpected executable rpaths',product,metadata['rpaths'],sorted(required),sorted(required|{'/usr/lib/swift'}))
            assert all(name.startswith(('/System/Library/','/usr/lib/')) for name in metadata['dylibs'])
            text=subprocess.check_output([str(pathlib.Path(t['llvm'])/'llvm-nm'),'--defined-only','-n',str(path)],env=env,text=True)
            names={p[2]:int(p[0],16) for line in text.splitlines() if len(p:=line.split())==3}
            assert entry in names and metadata['entryAddress']==names[entry]
            if product=='PlayportJIT-Extension':
                objc=subprocess.check_output([str(pathlib.Path(t['llvm'])/'llvm-objdump'),'--macho','--objc-meta-data',str(path)],env=env,text=True)
                assert 'EntrySmokePrincipal' in objc
            for prefix in (str(root),str(pathlib.Path.cwd()),str(pathlib.Path.home())):assert prefix.encode() not in data,('Fresh-output path',product,prefix)
            checker=root/'tools/check-macho-imports.py';assert hashlib.sha256(checker.read_bytes()).hexdigest()=='cd155383b94a75c30876f420d27383b365503b772743540372729baf2bf032b4'
            subprocess.run(['python3',str(checker),'--sdk',t['sdk'],'--platform','ios','--minos','26.0',str(path)],env=env,check=True)
            proof[product]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'metadata':metadata,
                'entry':entry,'entryAddress':names[entry],'sdkImportsPassed':True,'executed':False}
        result={'scope':'Own-source frontend/local graph/linker-toolset/entry mechanics only; not full Playport app or runtime closure',
            'productionHelperSha256':t['productionHelperSha256'],'extractedHelperSha256':t['extractedHelperSha256'],
            'linkerObserver':json.loads((root/'linker-observer.json').read_text()),'actualLinkerInvocations':invocations,
            'productionSequencePassedWithoutBuilderResolve':record['productionSequencePassedWithoutBuilderResolve'],
            'builderResolveRequired':record['builderResolveRequired'],'actualSwiftPMCrossCompileLinkPassed':True,'binaries':proof,
            'fullPlayportCompiled':False,'artifactsUploaded':False,'targetExecuted':False,'signerInvoked':False,'deviceAccessed':False,'gameFilesSupplied':False}
        (root/'entry-proof.json').write_text(json.dumps(result,indent=2));print(json.dumps(result,indent=2))
        PY
    - name: Record honest bounded frontend mechanics outcomes
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'Own-source frontend/entry smoke: prepare ${{ steps.prepare.outcome }}; checker ${{ steps.checker.outcome }}; cross-build ${{ steps.build.outcome }}; audit ${{ steps.inspect.outcome }}.' 'No full Playport runtime/app compile claim, target execution, signing, account/game/phone input, SDK export or artifact/cache upload. Next: review actual builderResolveRequired and toolset/entry proof before modifying production or starting the full build. No new thread required.' >> "$GITHUB_STEP_SUMMARY"
