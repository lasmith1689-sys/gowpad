name: Own native image data Apple SDK and ARM64 proof
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-image-sdk-v2-probe-20261026
    paths:
    - .github/workflows/native-image-sdk-v2-probe.yml
permissions:
  contents: read
concurrency:
  group: native-image-sdk-v2
  cancel-in-progress: false
jobs:
  native-image:
    if: github.repository == 'lasmith1689-sys/gowpad' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-image-sdk-v2-probe-20261026' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - name: Require exact public own-source context
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,pathlib,re\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/gowpad' and os.environ['GITHUB_REF']=='refs/heads/codex/native-image-sdk-v2-probe-20261026'\nassert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')\nassert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\nassert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/gowpad'\nif os.environ['GITHUB_EVENT_NAME']=='push':\n assert event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nroot=pathlib.Path('.work/native-image-sdk-v2').absolute()\nassert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))\n(root/'chunks').mkdir(parents=True)\nprint('Own generic native source + self-authored inert synthetic data only; no game/SDK inputs or uploads.')\n\nPY\n"
    - name: Stage own-source fragment 1
      id: stage0
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-image-sdk-v2/chunks/0000.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own-source fragment 2
      id: stage1
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-image-sdk-v2/chunks/0001.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own-source fragment 3
      id: stage2
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-image-sdk-v2/chunks/0002.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Authenticate complete exact own-source closure before writes
      id: assemble
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,zlib\nroot=pathlib.Path('.work/native-image-sdk-v2').absolute();source=root/'source'\nassert root.is_dir() and not source.exists() and not root.is_symlink()\nparts=sorted((root/'chunks').glob('*.b64'));assert [p.name for p in parts]==['0000.b64', '0001.b64', '0002.b64']\npacked=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)\nassert len(packed)==18922 and hashlib.sha256(packed).hexdigest()=='19222d18d093438a710cac4f633a089e526ab21a007e830cc0251adf99fb5aad'\ndecompressor=zlib.decompressobj();data=decompressor.decompress(packed,52520)\nassert len(data)==52519 and decompressor.eof and not decompressor.unused_data and not decompressor.unconsumed_tail\nrows=json.loads(data);manifest={'image_data.c': {'bytes': 5216, 'sha256': 'ea04427a18771bb2da60844406ad0707c81ac997d66196954b46be09b8a21893'}, 'image_data.h': {'bytes': 1509, 'sha256': 'b44d2dddc3d866b04efe27fff0ec72da85e4d09cd931107690f9fdb44f75dc21'},\
        \ 'host64.c': {'bytes': 6836, 'sha256': '144f495c374b41e1337918adf5a9112efcc2e697ac49383f1374bd931215822e'}, 'host64.h': {'bytes': 2694, 'sha256': 'eb55e8d79e165562a4845a7bc34dfeb95bdbc43970c864446edeaf0280228fe7'}, 'synthetic_pe64.py': {'bytes': 1692, 'sha256': '96407906e6457ae3e2135a94743c940ad55533010a68aada37fcef0636f1ad97'}, 'macho.py': {'bytes': 3138, 'sha256': 'c88bc3ab0bbd1d459ba125ff3758d789d62df9666ce994fef516e4a67c26677d'}, 'probe_image_sdk.c': {'bytes': 9627, 'sha256': '5655660fc9f436382f07a3680e1caa9dbc9f1732389eb3585211438137689495'}, 'run_sdk_v2.py': {'bytes': 8556, 'sha256': '2810d3872aa138fe9dcfde29daed1d6233d9feded78af527b35306338028b74d'}};assert set(rows)==set(manifest)\ndecoded={}\nfor name,row in manifest.items():\n assert name==pathlib.PurePosixPath(name).name and '/' not in name and chr(92) not in name\n b=base64.b64decode(rows[name],validate=True);assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\n decoded[name]=b\nsource.mkdir()\n\
        for name,b in decoded.items():(source/name).write_bytes(b)\n(root/'source-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+chr(10))\nprint(json.dumps({'sourceFiles':len(manifest),'sourceHashes':{n:r['sha256'] for n,r in manifest.items()},'gameInputsIncluded':False}))\n\nPY\n"
    - name: Compile actual iPhone SDK library and run native ARM64 synthetic consumers
      id: build
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib,subprocess,sys

        root=pathlib.Path(''.work/native-image-sdk-v2'').absolute()

        p=subprocess.run([sys.executable,str(root/''source/run_sdk_v2.py'')],cwd=root,timeout=600)

        assert p.returncode==0,''Actual SDK and native ARM64 fixture gates must pass''

        PY

        '
    - name: Require actual outcomes and unchanged source hashes
      id: final
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,pathlib\nroot=pathlib.Path('.work/native-image-sdk-v2').absolute();manifest=json.loads((root/'source-closure.json').read_text())\nfor name,row in manifest.items():\n b=(root/'source'/name).read_bytes();assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\np=root/'output/result.json';r=json.loads(p.read_text());assert r['status']=='passed'\nassert r['sourceHashes']=={n:v['sha256'] for n,v in manifest.items()}\nassert r['actualNativeMacARM64']=={'status':'passed','failureLine':0,'positive':5,'negative':12,'permissions':7,'consumers':4,'stops':4,'nx':1}\nassert r['versions']['iphoneSDK']=='27.1' and r['iosMetadata']['cpu']=='ARM64'\nassert r['iosMetadata']['codeSignatures']==0 and r['iosMetadata']['dependencies']==['/usr/lib/libSystem.B.dylib']\nassert r['productionCPUDispatcherTested'] is False and r['originalImageBytesOrGameCodeIncluded'] is False\nassert r['physicalIPhoneExecuted'] is False and r['SDKExported']\
        \ is False and r['artifactsUploaded'] is False\nprint(json.dumps({'status':'passed','resultSha256':hashlib.sha256(p.read_bytes()).hexdigest(),\n 'iosLibrarySha256':r['iosLibrarySha256'],'macExecutableSha256':r['macExecutableSha256'],\n 'fullGameClaimed':False,'gameInputsIncluded':False}))\n\nPY\n"
