name: Native CoD UIKit input source SDK closure
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-cod-input-ios-v2-probe-20261026
    paths:
    - .github/workflows/native-cod-input-ios-v2-probe.yml
permissions:
  contents: read
concurrency:
  group: native-cod-input-ios-v2-probe
  cancel-in-progress: false
jobs:
  cod-input-ios-v2:
    if: github.ref == 'refs/heads/codex/native-cod-input-ios-v2-probe-20261026'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - name: Inspect in-place Xcode iPhone SDK
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,pathlib,subprocess\nroot=pathlib.Path('.work/cod-uikit-input-v2').absolute();assert\
        \ not root.exists();root.mkdir(parents=True)\ndef out(args):return subprocess.check_output(args,text=True,timeout=30).strip()\n\
        developer=pathlib.Path(out(['xcode-select','-p']));assert developer.is_absolute() and developer.is_dir()\n\
        sdk=pathlib.Path(out(['xcrun','--sdk','iphoneos','--show-sdk-path']))\nversion=out(['xcrun','--sdk','iphoneos','--show-sdk-version']);assert\
        \ int(version.split('.')[0])>=26\nassert sdk.is_dir() and sdk.resolve().is_relative_to(developer.resolve())\n\
        tools={n:out(['xcrun','--sdk','iphoneos','-f',n]) for n in ['clang','nm']}\nfor p in tools.values():\n \
        \   q=pathlib.Path(p);assert q.is_absolute() and q.is_file() and q.resolve().is_relative_to(developer.resolve())\n\
        plan={'developer':str(developer),'sdk':str(sdk),'sdkVersion':version,'tools':tools,'sourceHashes':{},\n\
        \  'xcodeVersion':out(['xcodebuild','-version']),'clangVersion':out([tools['clang'],'--version'])}\n(root/'plan.json').write_text(json.dumps(plan,indent=2));print(json.dumps(plan,indent=2))\n\
        \nPY\n"
    - name: Materialize own portable lifecycle headers and queue
      id: queue_sources
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib\nroot=pathlib.Path('.work/cod-uikit-input-v2').absolute()\n\
        files={'native/aot/platform_init/v1/platform_init_v1.h': {'sha256': 'f8cd0b0386afe74254594259855381ce537a8e18a1f9b9ab0017029b518b60ae',\
        \ 'base64': ''},\
        \ 'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h': {'sha256': '29547c1f4172dd105ab211192a86a0845c97328a9cc9c162434175749580c5fd',\
        \ 'base64': ''},\
        \ 'native/platform/cod-gl-ios/input-v2/cod_input_queue_v2.h': {'sha256': '5db009917ace7802c60294a418d4e39c36bcbbf594cbf637986125d7df61b88b',\
        \ 'base64': ''},\
        \ 'native/platform/cod-gl-ios/input-v2/cod_input_queue_v2.c': {'sha256': 'efd787570343be9ad7c37844e2697c5abee53afe5011ba85776b03b4731c6256',\
        \ 'base64': ''}}\n\
        \nplan=json.loads((root/'plan.json').read_text())\nfor name,row in files.items():\n    p=root/name;assert\
        \ p.resolve().is_relative_to(root) and not p.exists()\n    b=base64.b64decode(row['base64'],validate=True);assert\
        \ hashlib.sha256(b).hexdigest()==row['sha256']\n    p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);plan['sourceHashes'][name]=row['sha256']\n\
        (root/'plan.json').write_text(json.dumps(plan,indent=2));print(json.dumps({'ownSourceHashes':plan['sourceHashes']}))\n\
        \nPY\n"
    - name: Materialize own actual UIKit touch view
      id: uikit_sources
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib\nroot=pathlib.Path('.work/cod-uikit-input-v2').absolute()\n\
        files={'native/platform/cod-gl-ios/input-v2/cod_uikit_input_v2.h': {'sha256': '6bed768ba33da8dcf73c387df4652153aa5c6984945865b533312bcb7916564c',\
        \ 'base64': ''},\
        \ 'native/platform/cod-gl-ios/input-v2/cod_uikit_input_v2.m': {'sha256': 'c25edb34171cba936bed2855c342f784c2d65d2891ec332f8c90ca73f22368b4',\
        \ 'base64': ''}}\n\
        \nplan=json.loads((root/'plan.json').read_text())\nfor name,row in files.items():\n    p=root/name;assert\
        \ p.resolve().is_relative_to(root) and not p.exists()\n    b=base64.b64decode(row['base64'],validate=True);assert\
        \ hashlib.sha256(b).hexdigest()==row['sha256']\n    p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);plan['sourceHashes'][name]=row['sha256']\n\
        (root/'plan.json').write_text(json.dumps(plan,indent=2));print(json.dumps({'ownSourceHashes':plan['sourceHashes']}))\n\
        \nPY\n"
    - name: Compile and link native input UIKit production units
      id: build
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,pathlib,subprocess\nroot=pathlib.Path('.work/cod-uikit-input-v2').absolute();plan=json.loads((root/'plan.json').read_text())\n\
        for n,h in plan['sourceHashes'].items():assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h\nlogs=[]\n\
        def run(label,args):\n    args=list(map(str,args));p=subprocess.run(args,capture_output=True,timeout=180,cwd=root)\n\
        \    for name,b in [('stdout',p.stdout),('stderr',p.stderr)]:\n        (root/(label+'.'+name+'.txt')).write_bytes(b)\n\
        \        print(label,name,b.decode(errors='replace'))\n    logs.append({'label':label,'argv':args,'exitCode':p.returncode,'stdoutSha256':hashlib.sha256(p.stdout).hexdigest(),'stderrSha256':hashlib.sha256(p.stderr).hexdigest()})\n\
        \    (root/'commands.json').write_text(json.dumps(logs,indent=2));assert p.returncode==0,label\ntools=plan['tools'];flags=['--target=arm64-apple-ios26.0','-isysroot',plan['sdk'],'-O2','-fno-fast-math','-fvisibility=hidden','-Wall','-Wextra','-Werror']\n\
        source=root/'native/platform/cod-gl-ios/input-v2'\nassert source.is_dir() and all((source/n).is_file() for\
        \ n in ('cod_input_queue_v2.c','cod_uikit_input_v2.m'))\nrun('compile-real-input-queue',[tools['clang'],*flags,'-std=c11','-c',source/'cod_input_queue_v2.c','-o',root/'queue.o'])\n\
        run('compile-real-uikit-input-view',[tools['clang'],*flags,'-fobjc-arc','-fblocks','-c',source/'cod_uikit_input_v2.m','-o',root/'input.o'])\n\
        run('link-input-production-closure',[tools['clang'],*flags,'-dynamiclib',root/'queue.o',root/'input.o',\n\
        \  '-framework','UIKit','-framework','Foundation','-framework','CoreGraphics',\n  '-Wl,-install_name,@rpath/libCodNativeInputIOSV2.dylib','-Wl,-no_uuid','-Wl,-no_adhoc_codesign','-Wl,-fatal_warnings',\n\
        \  '-o',root/'libCodNativeInputIOSV2.dylib'])\nrun('actual-input-undefined',[tools['nm'],'-u','-j',root/'libCodNativeInputIOSV2.dylib'])\n\
        \nPY\n"
    - name: Inspect actual Mach-O and strong public exports
      id: inspect
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\n\"\"\"Bounded Mach-O64 dyld export-trie inspection, independent\
        \ of nm visibility.\n\nFormat reference: Apple's xnu EXTERNAL_HEADERS/mach-o/loader.h.\nThis parser is self-authored\
        \ and does not execute or load the inspected image.\n\"\"\"\nimport hashlib\nimport struct\n\n\ndef parse_dyld_exports(image):\n\
        \    header=struct.unpack_from('<8I',image)\n    assert header[0]==0xfeedfacf and header[3]==6\n    end=32+header[5];assert\
        \ end<=len(image)\n    at=32;locations=[];segments=[]\n    for _ in range(header[4]):\n        command,size=struct.unpack_from('<II',image,at)\n\
        \        assert size>=8 and at+size<=end\n        if command==0x80000033:\n            assert size==16;locations.append(struct.unpack_from('<II',image,at+8))\n\
        \        elif command in (0x22,0x80000022):\n            assert size==48;locations.append(struct.unpack_from('<II',image,at+40))\n\
        \        elif command==0x19:\n            assert size>=72\n            vmaddr,vmsize,fileoff,filesize=struct.unpack_from('<4Q',image,at+24)\n\
        \            assert filesize<=vmsize and fileoff+filesize<=len(image)\n            segments.append({'name':image[at+8:at+24].split(b'\\\
        0')[0].decode(),\n              'vmaddr':vmaddr,'vmsize':vmsize,'fileoff':fileoff,'filesize':filesize,\n\
        \              'initialProtection':struct.unpack_from('<I',image,at+60)[0]})\n        at+=size\n    assert\
        \ at==end\n    locations=set((a,n) for a,n in locations if n)\n    assert len(locations)==1,'Exactly one\
        \ nonempty dyld export trie identity required'\n    start,length=next(iter(locations));assert start>=end\
        \ and start+length<=len(image)\n    trie=image[start:start+length]\n    header_segments=[s for s in segments\
        \ if s['fileoff']==0 and s['filesize']>=end]\n    assert len(header_segments)==1\n    image_vm=header_segments[0]['vmaddr']\n\
        \n    def uleb(p,limit):\n        value=0\n        for shift in range(0,70,7):\n            assert p<limit\n\
        \            byte=trie[p];p+=1\n            assert shift<63 or byte<=1,'ULEB64 overflow'\n            value|=(byte&127)<<shift\n\
        \            if byte<128:return value,p\n        raise AssertionError('Unterminated ULEB')\n\n    def terminated(p,limit):\n\
        \        q=trie.find(b'\\0',p,limit);assert q>=p\n        return trie[p:q].decode('utf-8'),q+1\n\n    pending=[(0,'',frozenset())];exports={};visits=0\n\
        \    while pending:\n        node,prefix,ancestors=pending.pop();visits+=1\n        assert visits<=100000\
        \ and node<len(trie) and node not in ancestors,'Export trie bounds/cycle'\n        assert len(prefix)<=4096\n\
        \        terminal_bytes,p=uleb(node,len(trie));terminal_end=p+terminal_bytes\n        assert terminal_end<len(trie)\n\
        \        if terminal_bytes:\n            flags,q=uleb(p,terminal_end);assert not flags&~0x1f\n         \
        \   info={'flags':flags}\n            if flags&8:\n                ordinal,q=uleb(q,terminal_end);import_name,q=terminated(q,terminal_end)\n\
        \                info.update(reexportOrdinal=ordinal,reexportName=import_name)\n            else:\n    \
        \            offset,q=uleb(q,terminal_end);info['imageOffset']=offset\n                if flags&16:info['resolverOffset'],q=uleb(q,terminal_end)\n\
        \            assert q==terminal_end and prefix and prefix not in exports\n            exports[prefix]=info\n\
        \        count=trie[terminal_end];p=terminal_end+1;edge_names=set()\n        for _ in range(count):\n  \
        \          edge,p=terminated(p,len(trie));target,p=uleb(p,len(trie))\n            assert edge and edge not\
        \ in edge_names and target<len(trie)\n            edge_names.add(edge);pending.append((target,prefix+edge,ancestors|{node}))\n\
        \    return {'offset':start,'bytes':length,'sha256':hashlib.sha256(trie).hexdigest(),\n            'symbols':exports,'imageVMAddress':image_vm,'segments':segments}\n\
        \n\ndef require_native_exports(proof,functions,classes):\n    required=set(functions)|set(classes);exports=proof['symbols']\n\
        \    assert required<=set(exports),('Missing actual dyld exports',sorted(required-set(exports)))\n    result={}\n\
        \    for name in sorted(required):\n        entry=exports[name]\n        assert entry['flags']==0 and entry['imageOffset']>0,(name,entry)\n\
        \        address=proof['imageVMAddress']+entry['imageOffset']\n        matches=[s for s in proof['segments']\
        \ if s['vmaddr']<=address<s['vmaddr']+s['filesize']]\n        assert len(matches)==1,(name,'Unbacked/ambiguous\
        \ export address')\n        executable=bool(matches[0]['initialProtection']&4)\n        assert executable==(name\
        \ in functions),(name,'Wrong code/data export region')\n        result[name]={**entry,'vmAddress':address,'segment':matches[0]['name']}\n\
        \    return result\n\n\nimport hashlib,json,pathlib,struct\nroot=pathlib.Path('.work/cod-uikit-input-v2').absolute();plan=json.loads((root/'plan.json').read_text())\n\
        for n,h in plan['sourceHashes'].items():assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h\nallowed={'/System/Library/Frameworks/UIKit.framework/UIKit','/System/Library/Frameworks/Foundation.framework/Foundation',\n\
        \  '/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics','/usr/lib/libSystem.B.dylib','/usr/lib/libobjc.A.dylib'}\n\
        def macho(b,filetype):\n    h=struct.unpack_from('<8I',b);assert h[0]==0xfeedfacf and h[1]==0x100000c and\
        \ h[3]==filetype\n    p=32;platforms=[];loads=[];ids=[]\n    for _ in range(h[4]):\n        cmd,size=struct.unpack_from('<II',b,p);assert\
        \ size>=8 and p+size<=32+h[5]<=len(b)\n        assert cmd not in [0x1d,0x21,0x2c,0x8000001c],('forbidden-load-command',filetype,hex(cmd),size)\n\
        \        if cmd==0x32:\n            platform,minimum,sdk=struct.unpack_from('<III',b,p+8);platforms.append([platform,minimum,sdk])\n\
        \            assert platform==2 and minimum==26<<16 and (filetype!=6 or sdk>=26<<16)\n        if cmd in\
        \ [0xc,0x80000018,0x8000001f,0x80000023,0x20,0xd]:\n            start=struct.unpack_from('<I',b,p+8)[0];assert\
        \ 24<=start<size\n            name=b[p+start:p+size].split(b'\\0',1)[0].decode()\n            if cmd==0xd:ids.append(name)\n\
        \            else:assert name in allowed,name;loads.append(name)\n        p+=size\n    assert p==32+h[5]\
        \ and len(platforms)==1\n    return {'platforms':platforms,'loads':loads,'ids':ids,'signaturePresent':False,'rpaths':[]}\n\
        reports={}\nfor name,filetype in [('queue.o',1),('input.o',1),('libCodNativeInputIOSV2.dylib',6)]:\n   \
        \ b=(root/name).read_bytes();assert str(root).encode() not in b and str(pathlib.Path.cwd()).encode() not\
        \ in b\n    reports[name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'metadata':macho(b,filetype)}\n\
        b=(root/'libCodNativeInputIOSV2.dylib').read_bytes();meta=reports['libCodNativeInputIOSV2.dylib']['metadata']\n\
        assert meta['ids']==['@rpath/libCodNativeInputIOSV2.dylib']\nassert {'/System/Library/Frameworks/UIKit.framework/UIKit','/System/Library/Frameworks/Foundation.framework/Foundation'}<=set(meta['loads'])\n\
        exports=parse_dyld_exports(b)\nrequired=require_native_exports(exports,{'_cod_uikit_input_v2_service'},{'_OBJC_CLASS_$_CodInputSurfaceV2','_OBJC_METACLASS_$_CodInputSurfaceV2'})\n\
        result={'sdkVersion':plan['sdkVersion'],'sourceHashes':plan['sourceHashes'],'artifacts':reports,'actualStrongDyldExports':required,\n\
        \  'inputQueueAndUIKitSDKCompiledLinked':True,'UIKitOrTouchSourceExecuted':False,'engineConsumerLinkedOrExecuted':False,\n\
        \  'originalGameOrAssetsIncluded':False,'appCreated':False,'gameReadinessVerified':False,'signingUsed':False,\n\
        \  'artifactsUploaded':False,'sdkExported':False}\n(root/'result.json').write_text(json.dumps(result,indent=2));print('RESULT_JSON_BEGIN');print(json.dumps(result,indent=2));print('RESULT_JSON_END')\n\
        \nPY\n"
