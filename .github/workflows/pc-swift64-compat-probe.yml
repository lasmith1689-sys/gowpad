name: Installed Swift 6.4 and Xcode 27 framework compatibility probe

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pc-games-runtime-probe-20261025
    paths:
      - .github/workflows/pc-swift64-compat-probe.yml

permissions:
  contents: read

concurrency:
  group: pc-swift64-compat-probe
  cancel-in-progress: false

jobs:
  swift64-sdk-compatibility:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Inspect the actual installed compiler and SDK before building
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'swift64-compat'
          assert not root.exists(), 'Refusing an existing probe directory'
          root.mkdir()
          (root / 'tmp').mkdir()
          def environment(developer=None):
              env = dict(os.environ)
              for key in ('SDKROOT', 'SDK_NAME', 'SDK_VERSION', 'TOOLCHAINS', 'SWIFT_EXEC', 'DEVELOPER_DIR', 'IPHONEOS_DEPLOYMENT_TARGET', 'MACOSX_DEPLOYMENT_TARGET'):
                  env.pop(key, None)
              env.update(TMPDIR=str(root / 'tmp'), LC_ALL='C')
              if developer:
                  env['DEVELOPER_DIR'] = str(developer)
              return env
          def version_tuple(value):
              match = re.search(r'(?:Swift version )?(\d+)\.(\d+)(?:\.(\d+))?', value)
              assert match, value
              return tuple(int(part or 0) for part in match.groups())
          def inspect(developer=None):
              env = environment(developer)
              def run(args):
                  return subprocess.check_output(args, env=env, text=True, timeout=30).strip()
              compiler = pathlib.Path(run(['/usr/bin/xcrun', '--sdk', 'macosx', '--find', 'swiftc'])).resolve()
              selected = next(path for path in compiler.parents if path.name == 'Developer')
              assert selected.is_relative_to(pathlib.Path('/Applications'))
              assert compiler.is_relative_to(selected)
              row = {'compiler': str(compiler), 'compilerVersion': run([str(compiler), '--version']),
                     'developerDir': str(selected), 'xcode': run(['/usr/bin/xcodebuild', '-version']),
                     'iosSDK': run(['/usr/bin/xcrun', '--sdk', 'iphoneos', '--show-sdk-path']),
                     'iosSDKVersion': run(['/usr/bin/xcrun', '--sdk', 'iphoneos', '--show-sdk-version']),
                     'macSDK': run(['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-path']),
                     'macSDKVersion': run(['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-version'])}
              assert 'Swift version ' in row['compilerVersion']
              row['meetsMinimums'] = version_tuple(row['compilerVersion'].split('Swift version ', 1)[1]) >= (6, 4, 0) and version_tuple(row['iosSDKVersion']) >= (27, 0, 0) and version_tuple(row['macSDKVersion']) >= (27, 0, 0)
              return row
          assert subprocess.check_output(['/usr/bin/uname', '-m'], text=True).strip() == 'arm64'
          rows = [inspect()]
          if not rows[0]['meetsMinimums']:
              stable = pathlib.Path('/Applications/Xcode_27.1.app/Contents/Developer')
              assert stable.is_dir(), 'Default insufficient and documented stable Xcode 27.1 absent'
              rows.append(inspect(stable))
          record = rows[-1]
          print(json.dumps({'observedSelections': rows}, indent=2))
          assert record['meetsMinimums'], 'Installed Swift >=6.4 and both SDKs >=27 required'
          for key in ('iosSDK', 'macSDK'):
              assert pathlib.Path(record[key]).resolve().is_relative_to(pathlib.Path(record['developerDir']))
          record['installedToolchain'] = str(next(path for path in pathlib.Path(record['compiler']).parents if path.suffix == '.xctoolchain'))
          record['runnerImageVersion'] = os.environ.get('ImageVersion')
          record['runnerImageOS'] = os.environ.get('ImageOS')
          record['globalDeveloperSelectionChanged'] = False
          (root / 'acquisition.json').write_text(json.dumps(record, indent=2))
          print('PASS: actual installed compiler and SDK minimums; per-command selection only.')
          PY
      - name: Probe exact compiler SwiftPM and real iPhone framework linkage
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'swift64-compat'
          record = json.loads((root / 'acquisition.json').read_text())
          assert record['meetsMinimums'] is True
          toolchain = pathlib.Path(record['installedToolchain']).resolve()
          assert toolchain.is_relative_to(pathlib.Path(record['developerDir']))
          env = dict(os.environ)
          for name in ('SDKROOT', 'SDK_NAME', 'SDK_VERSION', 'TOOLCHAINS', 'SWIFT_EXEC', 'IPHONEOS_DEPLOYMENT_TARGET', 'MACOSX_DEPLOYMENT_TARGET'):
              env.pop(name, None)
          env.update(DEVELOPER_DIR=record['developerDir'], TMPDIR=str(root / 'tmp'), LC_ALL='C')
          llvm_candidates = [pathlib.Path('/opt/homebrew/opt') / name / 'bin' for name in ('llvm@22', 'llvm@21', 'llvm@20', 'llvm')]
          llvm = next((path for path in llvm_candidates if all((path / name).is_file() for name in ('llvm-objdump', 'llvm-nm'))), None)
          assert llvm is not None, 'No already installed LLVM inspection tools; do not install globally in this probe'
          env['PATH'] = str(llvm) + os.pathsep + env.get('PATH', '')
          swift = toolchain / 'usr/bin/swift'
          swiftc = toolchain / 'usr/bin/swiftc'
          version = subprocess.check_output([str(swiftc), '--version'], env=env, text=True)
          print(version)
          match = re.search(r'\bSwift version (\d+)\.(\d+)', version)
          assert match and tuple(map(int, match.groups())) >= (6, 4), version
          package = root / 'manifest-probe'
          (package / 'Sources').mkdir(parents=True)
          (package / 'Sources/Probe.swift').write_text('public func manifestProbe() -> Int { 64 }\n')
          (package / 'Package.swift').write_text('// swift-tools-version:6.4\nimport PackageDescription\nlet package = Package(name: "Swift64ManifestProbe", platforms: [.iOS("26.0")], targets: [.target(name: "Probe", path: "Sources")])\n')
          package_env = dict(env, SDKROOT=record['macSDK'])
          manifest = subprocess.check_output([str(swift), 'package', '--package-path', str(package),
                       '--scratch-path', str(root / 'swiftpm-build'), '--cache-path', str(root / 'swiftpm-cache'),
                       '--config-path', str(root / 'swiftpm-config'), 'dump-package'], env=package_env, text=True)
          parsed = json.loads(manifest)
          assert parsed['name'] == 'Swift64ManifestProbe'
          assert parsed['toolsVersion']['_version'].startswith('6.4'), parsed['toolsVersion']
          (root / 'manifest-dump.json').write_text(manifest)
          source = root / 'FrameworkProbe.swift'
          source.write_text('''import Foundation
          import SwiftUI
          import Network
          import JavaScriptCore
          public struct CompilerCompatibilityView: View {
              public var body: some View { Text("Swift 6.4 SDK probe") }
          }
          @_cdecl("swift64_framework_probe")
          public func swift64FrameworkProbe() -> Int32 {
              let endpoint = NWEndpoint.hostPort(host: "localhost", port: 12345)
              let context = JSContext()
              let data = try? JSONSerialization.data(withJSONObject: ["endpoint": String(describing: endpoint)])
              return Int32((data?.count ?? 0) + (context == nil ? 0 : 1))
          }
          ''')
          output = root / 'libSwift64FrameworkProbe.dylib'
          flags = ['-target', 'arm64-apple-ios26.0', '-sdk', record['iosSDK'], '-swift-version', '6', '-Onone',
                   '-parse-as-library', '-module-cache-path', str(root / 'swift-module-cache'),
                   '-debug-prefix-map', str(root) + '=swift64-probe', '-file-prefix-map', str(root) + '=swift64-probe']
          subprocess.run([str(swiftc), *flags, '-v', '-module-name', 'Swift64FrameworkProbe', '-emit-library', str(source),
                          '-framework', 'Foundation', '-framework', 'SwiftUI', '-framework', 'Network', '-framework', 'JavaScriptCore',
                          '-Xlinker', '-no_adhoc_codesign', '-Xlinker', '-install_name', '-Xlinker', '@rpath/libSwift64FrameworkProbe.dylib',
                          '-o', str(output)], env=env, check=True)
          checker = root / 'check-macho-imports.py'
          checker_url = 'https://raw.githubusercontent.com/playportdev/playport/412de5f8c0bdd26d84e0127eb5776ba992e3b152/build/check-macho-imports.py'
          subprocess.run(['/usr/bin/curl', '--proto', '=https', '--proto-redir', '=https', '--tlsv1.2', '-fL', '--retry', '2',
                          '-o', str(checker), checker_url], env=env, check=True)
          assert hashlib.sha256(checker.read_bytes()).hexdigest() == 'cd155383b94a75c30876f420d27383b365503b772743540372729baf2bf032b4'
          subprocess.run(['python3', str(checker), '--sdk', record['iosSDK'], '--platform', 'ios', '--minos', '26.0',
                          '--exports', 'swift64_framework_probe', str(output)], env=env, check=True)
          proof = {'compilerVersion': version.strip(), 'compiler': str(swiftc), 'compilerSha256': hashlib.sha256(swiftc.resolve().read_bytes()).hexdigest(),
                   'swiftPMTools64ManifestParsed': True, 'iosSDKVersion': record['iosSDKVersion'], 'macSDKVersion': record['macSDKVersion'],
                   'frameworkProbeSha256': hashlib.sha256(output.read_bytes()).hexdigest(), 'frameworkProbeSDKImportsPassed': True,
                   'checkerURL': checker_url, 'checkerSha256': hashlib.sha256(checker.read_bytes()).hexdigest(),
                   'llvmToolsDirectory': str(llvm), 'probeDylibExecuted': False, 'fullAppCompatibilityClaimed': False}
          (root / 'compiler-proof.json').write_text(json.dumps(proof, indent=2))
          print(json.dumps(proof, indent=2))
          PY
      - name: Stage only the frozen StikJIT component for interface testing
        id: stikjit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'swift64-compat'
          archive = root / 'StikJIT-1.9.0.xcframework.zip'
          url = 'https://github.com/StikDebug/StikJIT/releases/download/1.9.0/StikJIT.xcframework.zip'
          subprocess.run(['/usr/bin/curl', '--proto', '=https', '--proto-redir', '=https', '--tlsv1.2', '-fL', '--retry', '2',
                          '-o', str(archive), url], check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '806664393770c68e75f2b6429955bfdd88cfaad09fec2ba70f8ed615ff90c060'
          output = root / 'stikjit'
          assert not output.exists()
          output.mkdir()
          with zipfile.ZipFile(archive) as package:
              names = [item.filename for item in package.infolist()]
              assert len(names) == len(set(names)), 'Duplicate component ZIP members'
              for item in package.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert (item.external_attr >> 16) & 0o170000 != 0o120000, 'ZIP symlink requires separate review'
              assert package.testzip() is None
              package.extractall(output)
          xcframework = output / 'StikJIT.xcframework'
          info = plistlib.loads((xcframework / 'Info.plist').read_bytes())
          devices = [row for row in info['AvailableLibraries'] if row.get('SupportedPlatform') == 'ios' and not row.get('SupportedPlatformVariant')]
          assert len(devices) == 1 and devices[0]['LibraryIdentifier'] == 'ios-arm64'
          assert devices[0]['LibraryPath'] == 'StikJIT.framework' and devices[0]['SupportedArchitectures'] == ['arm64']
          framework = xcframework / 'ios-arm64/StikJIT.framework'
          before = hashlib.sha256((framework / 'StikJIT').read_bytes()).hexdigest()
          # Frozen Playport staging fixes: data/resources/interfaces only, no Mach-O rewrite.
          for name in ('universal.js', 'legacy.js'):
              (framework / name).unlink(missing_ok=True)
          metadata = {'CFBundleDevelopmentRegion': 'en', 'CFBundleExecutable': 'StikJIT',
                      'CFBundleIdentifier': 'com.stik.StikJIT', 'CFBundleInfoDictionaryVersion': '6.0',
                      'CFBundleName': 'StikJIT', 'CFBundlePackageType': 'FMWK', 'CFBundleShortVersionString': '1.9.0',
                      'CFBundleVersion': '1.9.0', 'CFBundleSupportedPlatforms': ['iPhoneOS'], 'MinimumOSVersion': '17.4'}
          (framework / 'Info.plist').write_bytes(plistlib.dumps(metadata))
          interfaces = list((framework / 'Modules/StikJIT.swiftmodule').glob('*.swiftinterface'))
          assert interfaces
          for path in interfaces:
              text = path.read_text()
              text = re.sub(r'\bStikJIT\.StikJIT\.', 'StikJIT.', text)
              text = re.sub(r'\bStikJIT\.(DDIPaths|DeveloperDiskImageService|StikJITError)\b', r'\1', text)
              assert not re.search(r'(^|[^:])\bStikJIT\.(StikJIT|DDIPaths|DeveloperDiskImageService|StikJITError)\b', text)
              path.write_text(text)
          assert hashlib.sha256((framework / 'StikJIT').read_bytes()).hexdigest() == before
          for path in output.rglob('*'):
              assert path.resolve().is_relative_to(output.resolve())
          (root / 'stikjit-proof.json').write_text(json.dumps({'framework': str(framework), 'binarySha256': before,
                      'componentSourceBuiltByProbe': False, 'resourceAndInterfaceFixesMatchFrozenPlayport': True}, indent=2))
          print('PASS: frozen StikJIT component checksum and iOS metadata; binary unchanged; no JIT API called.')
          PY
      - name: Force the public Swift interface and link its real API against the installed SDK
        id: interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'swift64-compat'
          acquisition = json.loads((root / 'acquisition.json').read_text())
          proof = json.loads((root / 'compiler-proof.json').read_text())
          component = json.loads((root / 'stikjit-proof.json').read_text())
          assert acquisition['meetsMinimums'] is True and proof['swiftPMTools64ManifestParsed'] is True
          swiftc = pathlib.Path(proof['compiler'])
          assert swiftc.resolve().is_relative_to(pathlib.Path(acquisition['installedToolchain']).resolve())
          assert hashlib.sha256(swiftc.resolve().read_bytes()).hexdigest() == proof['compilerSha256']
          framework = pathlib.Path(component['framework'])
          assert framework.resolve().is_relative_to((root / 'stikjit').resolve())
          env = dict(os.environ)
          for name in ('SDKROOT', 'SDK_NAME', 'SDK_VERSION', 'TOOLCHAINS', 'SWIFT_EXEC', 'IPHONEOS_DEPLOYMENT_TARGET', 'MACOSX_DEPLOYMENT_TARGET'):
              env.pop(name, None)
          env.update(DEVELOPER_DIR=acquisition['developerDir'], TMPDIR=str(root / 'tmp'), LC_ALL='C')
          env['PATH'] = proof['llvmToolsDirectory'] + os.pathsep + env.get('PATH', '')
          modules = root / 'interface-modules'
          modules.mkdir()
          interface = framework / 'Modules/StikJIT.swiftmodule/arm64-apple-ios.swiftinterface'
          assert interface.is_file()
          subprocess.run([str(swiftc), '-frontend', '-compile-module-from-interface', str(interface), '-module-name', 'StikJIT',
                          '-target', 'arm64-apple-ios26.0', '-sdk', acquisition['iosSDK'], '-swift-version', '5', '-enable-objc-interop',
                          '-module-cache-path', str(root / 'stik-module-cache'), '-o', str(modules / 'StikJIT.swiftmodule')], env=env, check=True)
          source = root / 'StikJITCompatibilityProbe.swift'
          source.write_text('''import Foundation
          import StikJIT
          public func describePublicAPI(_ paths: DDIPaths, _ stage: StikJIT.PreparationStage) -> String {
              String(describing: paths) + String(describing: stage)
          }
          @_cdecl("swift64_stikjit_probe")
          public func swift64StikJITProbe() -> Int32 { MemoryLayout<DDIPaths>.size > 0 ? 1 : 0 }
          ''')
          binary = root / 'libSwift64StikJITProbe.dylib'
          subprocess.run([str(swiftc), '-target', 'arm64-apple-ios26.0', '-sdk', acquisition['iosSDK'], '-swift-version', '5',
                          '-Onone', '-parse-as-library', '-emit-library', '-module-name', 'Swift64StikJITProbe',
                          '-I', str(modules), '-F', str(framework.parent), '-module-cache-path', str(root / 'stik-module-cache'),
                          '-debug-prefix-map', str(root) + '=swift64-probe', '-file-prefix-map', str(root) + '=swift64-probe',
                          '-framework', 'StikJIT', '-framework', 'Foundation', '-Xlinker', '-no_adhoc_codesign',
                          '-Xlinker', '-install_name', '-Xlinker', '@rpath/libSwift64StikJITProbe.dylib',
                          str(source), '-o', str(binary)], env=env, check=True)
          def audit_load_paths(data, sdk):
              import pathlib, struct
              assert data[:4] == b'\xcf\xfa\xed\xfe', 'Expected thin Mach-O64'
              _, cpu, subtype, kind, count, size, flags, reserved = struct.unpack_from('<8I', data)
              assert cpu == 0x0100000c and kind == 6, (cpu, kind)
              assert 32 + size <= len(data)
              sdk = pathlib.Path(sdk).resolve()
              dylibs = {0xc, 0xd, 0x80000018, 0x8000001f, 0x20, 0x80000023}
              strings = dylibs | {0xe, 0xf, 0x8000001c, 0x27}
              unsupported = {0x6, 0x7, 0x9, 0x10, 0x12, 0x13, 0x14, 0x15, 0x2d, 0x80000035}
              rows = []
              at = 32
              for _ in range(count):
                  assert at + 8 <= 32 + size
                  command, length = struct.unpack_from('<II', data, at)
                  assert length >= 8 and length % 8 == 0 and at + length <= 32 + size
                  assert command not in unsupported, ('Unreviewed path-bearing load command', hex(command))
                  if command in strings:
                      header = 24 if command in dylibs else 12
                      assert length >= header
                      offset = struct.unpack_from('<I', data, at + 8)[0]
                      assert header <= offset < length
                      end = data.find(b'\0', at + offset, at + length)
                      assert end >= 0, 'Unterminated loader path'
                      value = data[at + offset:end].decode('utf-8')
                      assert value and not any(c in value for c in ('\\', '$', '\n', '\r'))
                      assert command != 0x27, 'LC_DYLD_ENVIRONMENT is not allowed'
                      assert not any(part in ('.', '..') for part in value.split('/'))
                      if value.startswith('/'):
                          assert value.startswith(('/System/Library/', '/usr/lib/')) and not value.startswith('//'), value
                          target = sdk / value.lstrip('/')
                          if command == 0x8000001c:
                              assert target.is_dir(), ('RPATH absent from SDK', value)
                          else:
                              candidates = [target, pathlib.Path(str(target) + '.tbd')]
                              if str(target).endswith('.dylib'):
                                  candidates.append(pathlib.Path(str(target)[:-6] + '.tbd'))
                              assert any(path.is_file() for path in candidates), ('Path absent from SDK', value)
                      else:
                          assert value.startswith(('@rpath/', '@loader_path/', '@executable_path/')), value
                          assert value.split('/', 1)[1] and ':' not in value, value
                      rows.append({'command': hex(command), 'path': value, 'fileOffset': at + offset})
                  at += length
              assert at == 32 + size, 'Load-command byte count mismatch'
              assert rows, 'No loader paths audited'
              return rows

          def write_stikjit_checker_adapter(checker, component, sdk):
              import hashlib, json, pathlib
              expected_checker = 'cd155383b94a75c30876f420d27383b365503b772743540372729baf2bf032b4'
              expected_binary = 'f15ad5c6766fa07d545be283c1c99eccde6a8baa97d73978a09ec080ca6381df'
              checker, component = pathlib.Path(checker).resolve(), pathlib.Path(component).resolve()
              original = checker.read_bytes()
              assert hashlib.sha256(original).hexdigest() == expected_checker, 'Pinned checker digest mismatch'
              data = component.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              print(json.dumps({'fixedStikJITPath': str(component), 'actualBinarySha256': actual, 'requiredBinarySha256': expected_binary}))
              assert actual == expected_binary, 'Different StikJIT bytes require fresh upstream-path review'
              rows = audit_load_paths(data, sdk)
              prefix = b'/Users/runner'
              offsets = []
              at = 0
              while (at := data.find(prefix, at)) >= 0:
                  offsets.append(at)
                  at += len(prefix)
              assert len(data) == 3177960 and len(offsets) == 242, 'Known upstream build-string identity mismatch'
              print(json.dumps({'finding': 'Known fixed upstream Rust build paths; loader paths separately audited',
                                'rawPathPrefix': prefix.decode(), 'rawPathOffsets': offsets, 'loaderPaths': rows}, indent=2))
              # Keep the adapter beside the pinned checker: its repository-root path audit is unchanged.
              adapter = checker.with_name('check-macho-imports-stikjit-adapter.py')
              assert adapter.parent == checker.parent and adapter != checker
              source = original.decode()
              marker = '            bad.append(f"names the path {p}")'
              assert source.count(marker) == 1
              replacement = '            if not verified_stikjit_build_path(a.dylib, p):\n    ' + marker
              source = source.replace(marker, replacement)
              audit_source = "def audit_load_paths(data, sdk):\n    import pathlib, struct\n    assert data[:4] == b'\\xcf\\xfa\\xed\\xfe', 'Expected thin Mach-O64'\n    _, cpu, subtype, kind, count, size, flags, reserved = struct.unpack_from('<8I', data)\n    assert cpu == 0x0100000c and kind == 6, (cpu, kind)\n    assert 32 + size <= len(data)\n    sdk = pathlib.Path(sdk).resolve()\n    dylibs = {0xc, 0xd, 0x80000018, 0x8000001f, 0x20, 0x80000023}\n    strings = dylibs | {0xe, 0xf, 0x8000001c, 0x27}\n    unsupported = {0x6, 0x7, 0x9, 0x10, 0x12, 0x13, 0x14, 0x15, 0x2d, 0x80000035}\n    rows = []\n    at = 32\n    for _ in range(count):\n        assert at + 8 <= 32 + size\n        command, length = struct.unpack_from('<II', data, at)\n        assert length >= 8 and length % 8 == 0 and at + length <= 32 + size\n        assert command not in unsupported, ('Unreviewed path-bearing load command', hex(command))\n        if command in strings:\n            header = 24 if command in dylibs else 12\n            assert length >= header\n            offset = struct.unpack_from('<I', data, at + 8)[0]\n            assert header <= offset < length\n            end = data.find(b'\\0', at + offset, at + length)\n            assert end >= 0, 'Unterminated loader path'\n            value = data[at + offset:end].decode('utf-8')\n            assert value and not any(c in value for c in ('\\\\', '$', '\\n', '\\r'))\n            assert command != 0x27, 'LC_DYLD_ENVIRONMENT is not allowed'\n            assert not any(part in ('.', '..') for part in value.split('/'))\n            if value.startswith('/'):\n                assert value.startswith(('/System/Library/', '/usr/lib/')) and not value.startswith('//'), value\n                target = sdk / value.lstrip('/')\n                if command == 0x8000001c:\n                    assert target.is_dir(), ('RPATH absent from SDK', value)\n                else:\n                    candidates = [target, pathlib.Path(str(target) + '.tbd')]\n                    if str(target).endswith('.dylib'):\n                        candidates.append(pathlib.Path(str(target)[:-6] + '.tbd'))\n                    assert any(path.is_file() for path in candidates), ('Path absent from SDK', value)\n            else:\n                assert value.startswith(('@rpath/', '@loader_path/', '@executable_path/')), value\n                assert value.split('/', 1)[1] and ':' not in value, value\n            rows.append({'command': hex(command), 'path': value, 'fileOffset': at + offset})\n        at += length\n    assert at == 32 + size, 'Load-command byte count mismatch'\n    assert rows, 'No loader paths audited'\n    return rows\n\n"
              injected = audit_source + '\n' + (
                  'def verified_stikjit_build_path(candidate, prefix):\n'
                  '    import hashlib, pathlib\n'
                  '    if pathlib.Path(candidate).resolve() != pathlib.Path(' + repr(str(component)) + ') or prefix != "/Users/runner":\n'
                  '        return False\n'
                  '    data = pathlib.Path(candidate).read_bytes()\n'
                  '    assert hashlib.sha256(data).hexdigest() == "' + expected_binary + '", "StikJIT changed before audit"\n'
                  '    audit_load_paths(data, ' + repr(str(pathlib.Path(sdk).resolve())) + ')\n'
                  '    return True\n\n')
              sentinel = 'PLATFORM_ID = {"macos": 1, "ios": 2}\n'
              assert source.count(sentinel) == 1
              source = source.replace(sentinel, sentinel + '\n' + injected)
              compile(source, str(adapter), 'exec')
              adapter.write_text(source)
              assert checker.read_bytes() == original and component.read_bytes() == data
              return adapter
          adapter = write_stikjit_checker_adapter(root / 'check-macho-imports.py', framework / 'StikJIT', acquisition['iosSDK'])
          checker = ['python3', str(root / 'check-macho-imports.py'), '--sdk', acquisition['iosSDK'], '--platform', 'ios']
          subprocess.run(['python3', str(adapter), '--sdk', acquisition['iosSDK'], '--platform', 'ios', '--minos', '17.4', str(framework / 'StikJIT')], env=env, check=True)
          subprocess.run(checker + ['--minos', '26.0', '--with', str(framework / 'StikJIT'), '--exports', 'swift64_stikjit_probe', str(binary)], env=env, check=True)
          record = {'forcedPublicInterfaceCompiled': True, 'realPublicAPILinked': True, 'sdkImportsPassed': True,
                    'sdkVersion': acquisition['iosSDKVersion'], 'compilerVersion': proof['compilerVersion'],
                    'interfaceSha256': hashlib.sha256(interface.read_bytes()).hexdigest(),
                    'probeBinarySha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                    'stikjitBinarySha256': component['binarySha256'], 'probeExecuted': False,
                    'jitEnabled': False, 'fullPlayportAppLinked': False, 'installedToolchain': acquisition['installedToolchain']}
          (root / 'compatibility-proof.json').write_text(json.dumps(record, indent=2))
          print(json.dumps(record, indent=2))
          print('PASS: installed Swift >=6.4 compiler/SwiftPM/framework/interface SDK pairing checked; full app and phone behavior remain unverified.')
          PY
      - name: Record actual compatibility outcomes
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Actual installed Swift >=6.4 and SDK >=27: ${{ steps.toolchain.outcome }}.' \
            'Exact compiler, Swift tools 6.4 manifest and real iPhone framework link/imports: ${{ steps.compiler.outcome }}.' \
            'Frozen StikJIT component: ${{ steps.stikjit.outcome }}; forced interface and public-API SDK link/imports: ${{ steps.interface.outcome }}.' \
            'No toolchain/package download or install, global developer-directory change, SDK export, artifact/cache upload, signing credentials, game input or phone/JIT action.' \
            'A partial pass is not complete app compatibility. Next: review actual results before selecting this compiler for the full media/app work. Continue in the current thread; no new thread required.' >> "$GITHUB_STEP_SUMMARY"
