name: Native UIKit input actual lifecycle fixture
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-cod-input-functional-v2-20261026
    paths:
    - .github/workflows/native-cod-input-functional-v2.yml
permissions:
  contents: read
concurrency:
  group: native-cod-input-functional-v2
  cancel-in-progress: false
jobs:
  native-input-functional:
    if: github.repository == 'lasmith1689-sys/gowpad' && github.event.repository.private == false && github.ref
      == 'refs/heads/codex/native-cod-input-functional-v2-20261026' && (github.event_name == 'push' || github.event_name
      == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Require isolated own-source context and installed Simulator
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,pathlib,re,subprocess\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/gowpad'\n\
        assert os.environ['GITHUB_REF']=='refs/heads/codex/native-cod-input-functional-v2-20261026'\nassert os.environ['GITHUB_EVENT_NAME']\
        \ in ('push','workflow_dispatch')\nassert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        assert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/gowpad'\n\
        if os.environ['GITHUB_EVENT_NAME']=='push':assert event['after']==os.environ['GITHUB_SHA'] and not event.get('deleted',False)\n\
        root=pathlib.Path('.work/cod-input-functional-v2').absolute()\nassert not root.exists() and not any(p.is_symlink()\
        \ for p in (root,*root.parents));root.mkdir(parents=True)\ndef out(args):return subprocess.check_output(args,text=True,timeout=60).strip()\n\
        developer=pathlib.Path(out(['xcode-select','-p']));assert developer.is_absolute() and developer.is_dir()\n\
        sdk=pathlib.Path(out(['xcrun','--sdk','iphonesimulator','--show-sdk-path']))\nversion=out(['xcrun','--sdk','iphonesimulator','--show-sdk-version']);assert\
        \ int(version.split('.')[0])>=26\nassert sdk.is_dir() and sdk.resolve().is_relative_to(developer.resolve())\n\
        tools={n:out(['xcrun','--sdk','iphonesimulator','-f',n]) for n in ('clang','nm')}\nfor value in tools.values():\n\
        \    p=pathlib.Path(value);assert p.is_absolute() and p.is_file() and p.resolve().is_relative_to(developer.resolve())\n\
        inventory=json.loads(out(['xcrun','simctl','list','--json']))\n(root/'simulator-inventory.json').write_text(json.dumps(inventory,indent=2))\n\
        runtimes=[r for r in inventory.get('runtimes',[]) if r.get('isAvailable') is True and\n    r.get('identifier','').startswith('com.apple.CoreSimulator.SimRuntime.iOS-')\
        \ and int(r.get('version','0').split('.')[0])>=26]\nruntimes.sort(key=lambda r:tuple(int(v) for v in r['version'].split('.')),reverse=True)\n\
        chosen=None\nfor runtime in runtimes:\n    phones=[d for d in inventory.get('devices',{}).get(runtime['identifier'],[])\
        \ if d.get('isAvailable') is True and d.get('name','').startswith('iPhone')]\n    for phone in sorted(phones,key=lambda\
        \ d:d['name']):\n        kind=phone.get('deviceTypeIdentifier')\n        if not kind:\n            kinds=[d['identifier']\
        \ for d in inventory.get('devicetypes',[]) if d.get('name')==phone['name']]\n            if len(kinds)==1:kind=kinds[0]\n\
        \        if kind and kind.startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-'):\n            chosen={'runtimeIdentifier':runtime['identifier'],'runtimeVersion':runtime['version'],\n\
        \                'runtimeBuild':runtime.get('buildversion'),'deviceTypeIdentifier':kind,\n             \
        \   'compatibilityBasis':'Already configured available iPhone in this installed runtime','existingDeviceName':phone['name']};break\n\
        \    if chosen:break\nassert chosen is not None,'No already-installed compatible iOS26+ iPhone Simulator;\
        \ no platform downloaded'\nmanifest={'native/aot/platform_init/v1/platform_init_v1.h': {'bytes': 3438, 'sha256':\
        \ 'f8cd0b0386afe74254594259855381ce537a8e18a1f9b9ab0017029b518b60ae'}, 'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h':\
        \ {'bytes': 1938, 'sha256': '29547c1f4172dd105ab211192a86a0845c97328a9cc9c162434175749580c5fd'}, 'native/platform/cod-gl-ios/input-v2/cod_input_queue_v2.h':\
        \ {'bytes': 898, 'sha256': '5db009917ace7802c60294a418d4e39c36bcbbf594cbf637986125d7df61b88b'}, 'native/platform/cod-gl-ios/input-v2/cod_input_queue_v2.c':\
        \ {'bytes': 3950, 'sha256': 'efd787570343be9ad7c37844e2697c5abee53afe5011ba85776b03b4731c6256'}, 'native/platform/cod-gl-ios/input-v2/cod_uikit_input_v2.h':\
        \ {'bytes': 2038, 'sha256': '6bed768ba33da8dcf73c387df4652153aa5c6984945865b533312bcb7916564c'}, 'native/platform/cod-gl-ios/input-v2/cod_uikit_input_v2.m':\
        \ {'bytes': 8484, 'sha256': 'c25edb34171cba936bed2855c342f784c2d65d2891ec332f8c90ca73f22368b4'}, 'input_app.m':\
        \ {'bytes': 13248, 'sha256': 'ad46e502caae2c22fcef5c52f9819ab5d7c94ac2b64c4acf389c056cba0bf37e'}, 'check_capture.py':\
        \ {'bytes': 5670, 'sha256': 'b75a21098cdc005753616089d4165d26e6e6638448371636b4f84e84b1e975a4'}, 'build_probe.py':\
        \ {'bytes': 9588, 'sha256': 'b44396b01f1b2fe2d1100fff25be8a73777c12e508b2ebdfcd527062f0ff0ec7'}, 'run_probe.py':\
        \ {'bytes': 8468, 'sha256': 'ecd31475f415f9602a7fcabc5a419b2f486386a2bca5a7080340f5e713c08786'}, 'check_signature.py':\
        \ {'bytes': 3096, 'sha256': '30ca89933fe09783bc0f5edbe1160fa8177d4a1c2799432b11456685563c7a1a'}};revision='51e992466f1404df42ba1eee65589cff40f874dcc30a925b58c46b2be8e32201'\n\
        assert hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()==revision\n\
        plan={'developer':str(developer),'sdk':str(sdk),'sdkVersion':version,'tools':tools,'simulatorSelection':chosen,\n\
        \    'xcodeVersion':out(['xcodebuild','-version']),'clangVersion':out([tools['clang'],'--version']),\n \
        \   'sourceManifest':manifest,'revision':revision,'gameInputsIncluded':False,'syntheticConsumerOnly':True}\n\
        (root/'plan.json').write_text(json.dumps(plan,indent=2));print(json.dumps(plan,indent=2))\n\nPY\n"
    - name: Stage own bounded source fragment 1
      id: chunk0
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        root=pathlib.Path(''.work/cod-input-functional-v2'').absolute();assert root.is_dir() and not root.is_symlink()

        p=root/''payload-0000.b64'';assert not p.exists();p.write_text('''',encoding=''ascii'')


        PY

        '
    - name: Stage own bounded source fragment 2
      id: chunk1
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        root=pathlib.Path(''.work/cod-input-functional-v2'').absolute();assert root.is_dir() and not root.is_symlink()

        p=root/''payload-0001.b64'';assert not p.exists();p.write_text('''',encoding=''ascii'')


        PY

        '
    - name: Stage own bounded source fragment 3
      id: chunk2
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        root=pathlib.Path(''.work/cod-input-functional-v2'').absolute();assert root.is_dir() and not root.is_symlink()

        p=root/''payload-0002.b64'';assert not p.exists();p.write_text('''',encoding=''ascii'')


        PY

        '
    - name: Stage own bounded source fragment 4
      id: chunk3
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        root=pathlib.Path(''.work/cod-input-functional-v2'').absolute();assert root.is_dir() and not root.is_symlink()

        p=root/''payload-0003.b64'';assert not p.exists();p.write_text('''',encoding=''ascii'')


        PY

        '
    - name: Authenticate complete own-source closure before writes
      id: materialize
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,zlib\nroot=pathlib.Path('.work/cod-input-functional-v2').absolute();plan=json.loads((root/'plan.json').read_text())\n\
        manifest=plan['sourceManifest'];encoded=''.join((root/('payload-%04d.b64'%i)).read_text(encoding='ascii')\
        \ for i in range(4))\nassert len(encoded)==37952\npacked=base64.b64decode(encoded,validate=True);assert\
        \ len(packed)==28463 and hashlib.sha256(packed).hexdigest()=='f797c339bf9327874343a3cb10c97b7bad21412a2c12097321152f0b4e7c97ff'\n\
        decoder=zlib.decompressobj();framed=decoder.decompress(packed,81561)\nassert len(framed)==81560 and decoder.eof\
        \ and not decoder.unused_data and not decoder.unconsumed_tail\nfiles=json.loads(framed);assert set(files)==set(manifest)\n\
        decoded={}\nfor name,row in manifest.items():\n    relative=pathlib.PurePosixPath(name);assert not relative.is_absolute()\
        \ and all(p not in ('','..','.') for p in relative.parts)\n    p=root/name;assert p.resolve().is_relative_to(root)\
        \ and not p.exists() and not any(q.is_symlink() for q in p.parents)\n    b=base64.b64decode(files[name],validate=True);assert\
        \ len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256'];decoded[name]=b\nfor name,b in decoded.items():\n\
        \    p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)\nprint(json.dumps({'ownSourceFiles':len(manifest),'sourceClosureSha256':plan['revision'],'gameInputsIncluded':False}))\n\
        \nPY\n"
    - name: Compile and audit actual native UIKit lifecycle app
      id: build
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import hashlib,json,pathlib,subprocess,sys

        root=pathlib.Path(''.work/cod-input-functional-v2'').absolute();plan=json.loads((root/''plan.json'').read_text())

        for name,row in plan[''sourceManifest''].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==row[''sha256'']

        subprocess.run([sys.executable,str(root/''build_probe.py''),str(root)],cwd=root,check=True,timeout=600)


        PY

        '
    - name: Execute actual lifecycle and remove only owned Simulator
      id: functional
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import hashlib,json,pathlib,subprocess,sys

        root=pathlib.Path(''.work/cod-input-functional-v2'').absolute();plan=json.loads((root/''plan.json'').read_text())

        for name,row in plan[''sourceManifest''].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==row[''sha256'']

        subprocess.run([sys.executable,str(root/''run_probe.py''),str(root)],cwd=root,check=True,timeout=780)


        PY

        '
