name: Native binary32 helpers Apple SDK and ARM64 execution
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-scalar32-sdk-probe-20261026
    paths:
    - .github/workflows/native-scalar32-sdk-probe.yml
permissions:
  contents: read
concurrency:
  group: native-scalar32-sdk-probe
  cancel-in-progress: false
jobs:
  native-scalar32:
    if: github.repository == 'lasmith1689-sys/gowpad' && github.ref == 'refs/heads/codex/native-scalar32-sdk-probe-20261026'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - name: Compile SDK library and execute own ARM64 numeric fixtures
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,platform,struct,subprocess\n\
        files={'scalar32.c': {'base64': '',\
        \ 'sha256': 'd55a2794e6526fc0fd399d8a0b645adfebb0bd643f0987f90ebe5ffe9a90b1ec'}, 'scalar32.h': {'base64':\
        \ '',\
        \ 'sha256': '65c921663bb5ff3f384a8fbd4125945b3c9c24f6382aabc0c0fe5eb0ce1a6ef9'}, 'scalar32_sdk_probe.c':\
        \ {'base64': '',\
        \ 'sha256': '7b766867f1a77b93bbf16866d24b5adbe2ecb97bfc13a4b8772700df9eab43d2'}}\n\nassert platform.machine()=='arm64',platform.machine()\n\
        root=pathlib.Path('.work/scalar32-sdk').absolute();root.mkdir(parents=True,exist_ok=False)\ndef run(args):\n\
        \    p=subprocess.run([str(a) for a in args],cwd=root,capture_output=True,text=True,timeout=120)\n    if\
        \ p.returncode:print(p.stdout);print(p.stderr)\n    assert p.returncode==0,{'tool':str(args[0]),'status':p.returncode}\n\
        \    return p.stdout.strip()\nfor name,row in files.items():\n    raw=base64.b64decode(row['base64'],validate=True);assert\
        \ hashlib.sha256(raw).hexdigest()==row['sha256']\n    (root/name).write_bytes(raw)\nxcode=run(['/usr/bin/xcodebuild','-version'])\n\
        ios=run(['/usr/bin/xcrun','--sdk','iphoneos','--show-sdk-path'])\nmac=run(['/usr/bin/xcrun','--sdk','macosx','--show-sdk-path'])\n\
        version=run(['/usr/bin/xcrun','--sdk','iphoneos','--show-sdk-version'])\nassert version=='27.1',version\n\
        clang=run(['/usr/bin/xcrun','--sdk','iphoneos','--find','clang'])\ncommon=['-std=c11','-O2','-Wall','-Wextra','-Werror','-fno-fast-math','-ffp-contract=off']\n\
        binary=root/'scalar32-native-arm64'\nrun([clang,'-target','arm64-apple-macos14.0','-isysroot',mac,*common,\n\
        \     root/'scalar32.c',root/'scalar32_sdk_probe.c','-o',binary])\nexecutable=binary.read_bytes();header=struct.unpack_from('<8I',executable)\n\
        assert header[0]==0xfeedfacf and header[1]==0x100000c and header[3]==2\nresult=json.loads(run([binary]));assert\
        \ result['status']=='passed'\nassert result['wordPairCases']==146560 and result['unsupportedPolicies']==9\n\
        dylib=root/'libNativeScalar32.dylib'\nrun([clang,'-target','arm64-apple-ios26.0','-isysroot',ios,*common,'-ffreestanding',\n\
        \     '-fno-stack-protector','-nostdlib','-lSystem','-dynamiclib','-Wl,-no_adhoc_codesign',\n     '-install_name','@rpath/libNativeScalar32.dylib',root/'scalar32.c','-o',dylib])\n\
        image=dylib.read_bytes();magic,cpu,subtype,kind,count,size,flags,reserved=struct.unpack_from('<8I',image)\n\
        assert magic==0xfeedfacf and cpu==0x100000c and kind==6\nat=32;versions=[];signed=False\nfor _ in range(count):\n\
        \    command,length=struct.unpack_from('<II',image,at);assert length>=8 and at+length<=32+size\n    if command==0x32:versions.append(struct.unpack_from('<4I',image,at+8))\n\
        \    if command==0x1d:signed=True\n    at+=length\nassert at==32+size and len(versions)==1\nassert versions[0][:3]==(2,26<<16,(27<<16)|(1<<8))\
        \ and not signed\nnm=run(['/usr/bin/xcrun','--sdk','iphoneos','--find','nm'])\nsymbols=run([nm,'-gU',dylib])\n\
        assert '_pc64_comiss32_bits' in symbols and '_pc64_minss32_bits' in symbols\nfor name,row in files.items():assert\
        \ hashlib.sha256((root/name).read_bytes()).hexdigest()==row['sha256']\nprint(json.dumps({'status':'passed','xcode':xcode,'iPhoneSDK':version,'nativeMacARM64':result,\n\
        \  'iosLibraryBytes':len(image),'iosLibrarySha256':hashlib.sha256(image).hexdigest(),\n  'macExecutableSha256':hashlib.sha256(executable).hexdigest(),\n\
        \  'sourceHashes':{n:r['sha256'] for n,r in files.items()},'signed':signed,\n  'gameCodeIncluded':False,'recoveredGameFunctionsCompiled':False,'physicalIPhoneExecution':False,\n\
        \  'assetsOrSigningUsed':False,'artifactsUploaded':False,'SDKExported':False},indent=2))\n\nPY\n"
