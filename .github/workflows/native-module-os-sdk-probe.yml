name: Generic native host OS Apple SDK and ARM64 proof
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-module-os-sdk-probe-20261027
    paths:
    - .github/workflows/native-module-os-sdk-probe.yml
permissions:
  contents: read
concurrency:
  group: native-module-os-sdk-v1
  cancel-in-progress: false
jobs:
  native-os:
    if: github.repository == 'lasmith1689-sys/gowpad' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-module-os-sdk-probe-20261027' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - name: Require isolated public generic-source context
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,pathlib,re\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/gowpad' and os.environ['GITHUB_REF']=='refs/heads/codex/native-module-os-sdk-probe-20261027'\nassert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')\nassert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\nassert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/gowpad'\nif os.environ['GITHUB_EVENT_NAME']=='push':\n assert event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nroot=pathlib.Path('.work/native-module-os-sdk-v1').absolute()\nassert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))\n(root/'chunks').mkdir(parents=True)\nprint('Generic OS source and synthetic fixtures only; no private engine inputs, secrets, artifacts or SDK export.')\n\nPY\n"
    - name: Stage own generic source fragment 1
      id: stage0
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-module-os-sdk-v1/chunks/0000.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own generic source fragment 2
      id: stage1
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-module-os-sdk-v1/chunks/0001.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Authenticate exact complete generic source closure
      id: assemble
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,zlib\nroot=pathlib.Path('.work/native-module-os-sdk-v1').absolute();source=root/'source'\nassert root.is_dir() and not source.exists() and not root.is_symlink()\nparts=sorted((root/'chunks').glob('*.b64'));assert [p.name for p in parts]==['0000.b64', '0001.b64']\npacked=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)\nassert len(packed)==8616 and hashlib.sha256(packed).hexdigest()=='985112cea130648d4fb734baf2a341ba21afbd0533e1aefea8095d6135989fb5'\nd=zlib.decompressobj();data=d.decompress(packed,19766)\nassert len(data)==19765 and d.eof and not d.unused_data and not d.unconsumed_tail\nrows=json.loads(data);manifest={'native_module_os_v2.c': {'bytes': 1188, 'sha256': 'e7e0d4c75ee9fc7be576f13888b0cb57814b066005f9ecc620d9c96715c23c7c'}, 'native_module_os_v2.h': {'bytes': 449, 'sha256': '79777a02e94e81a5451101fc27f50c177815cb81458f4fe634e7a4b3133e7a9d'}, 'macho.py': {'bytes': 3269, 'sha256':\
        \ 'f050110ca1d2c9d056f8d0e73704f1a2066911ec3ef7265ce96982848e932ec5'}, 'host_metadata.py': {'bytes': 2665, 'sha256': '3a6cc0ed25b31756d7e86548d08c111a61b6a9b2430476fb20f31a105463a421'}, 'probe_module_os.c': {'bytes': 2562, 'sha256': '116558bc1fc8722fa1ab75038352ae9fd28b5675c73ced4d9d9af1126023cbed'}, 'run_sdk.py': {'bytes': 4581, 'sha256': '62d93c16d08b948db41082c2be19025f464756a8244c64aa948fc3ce0c9c8748'}};assert set(rows)==set(manifest)\ndecoded={}\nfor name,row in manifest.items():\n assert name==pathlib.PurePosixPath(name).name and '/' not in name and chr(92) not in name\n b=base64.b64decode(rows[name],validate=True);assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\n decoded[name]=b\nsource.mkdir()\nfor name,b in decoded.items():(source/name).write_bytes(b)\n(root/'source-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+chr(10))\nprint(json.dumps({'sourceFiles':len(manifest),'sourceHashes':{n:r['sha256'] for n,r in manifest.items()},'gameInputsIncluded':False}))\n\
        \nPY\n"
    - name: Actual native Mac ARM64 tests and unsigned iPhone SDK library
      id: build
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib,subprocess,sys

        root=pathlib.Path(''.work/native-module-os-sdk-v1'').absolute()

        p=subprocess.run([sys.executable,str(root/''source/run_sdk.py'')],cwd=root,timeout=540)

        assert p.returncode==0,''Actual SDK and native fixture gates must pass''

        PY

        '
    - name: Require actual outcomes and unchanged source hashes
      id: final
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import hashlib,json,pathlib

        root=pathlib.Path(''.work/native-module-os-sdk-v1'').absolute();manifest=json.loads((root/''source-closure.json'').read_text())

        for name,row in manifest.items():assert hashlib.sha256((root/''source''/name).read_bytes()).hexdigest()==row[''sha256'']

        result=json.loads((root/''output/result.json'').read_text());assert result[''status'']==''passed''

        assert result[''sourceHashes'']=={n:v[''sha256''] for n,v in manifest.items()}

        assert result[''actualAppleSDKUsed''] and result[''productionGenericDarwinBackendCompiled'']

        for name in (''gameInputsIncluded'',''gameExecuted'',''physicalIPhoneExecuted'',''developerIdentityUsed'',''SDKExported'',''artifactsUploaded''):assert result[name] is False

        print(json.dumps({''status'':''passed'',''iosLibrarySha256'':result[''iosLibrarySha256''],''actualNativeMacARM64'':result[''actualNativeMacARM64''],''gameReady'':False}))


        PY

        '
