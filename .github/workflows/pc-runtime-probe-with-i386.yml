          ipa, output = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          component_package = json.loads((ipa.parent / 'i386-package-verification.json').read_text())
          assert all(component_package[key] is True for key in ('i386FarmIncluded', 'dockHostIncluded', 'dockNoticesIncluded', 'zipCheckedBeforeEncryption'))
          assert component_package['system32InstallerPathVerified'] is False
          metadata = {
              'source': 'e3a88fddb8daed1f5ac28a45dcb4663d65192629',
              'workflowCommit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
              'filename': 'runtime-unsigned.ipa', 'size': ipa.stat().st_size,
              'sha256': digest(ipa), 'cipherSha256': digest(output / 'runtime.cms'),
              'recipientCertificateSha256': '40b2d01b43f93ceadc15d7355d0eed38faa2a3c05529bde70faa5c7f40608919',
              'cipher': 'CMS AES-256-GCM with RSA-OAEP-SHA256',
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'sdk': subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], text=True).strip(),
              'developerProvisioningPerformed': False, 'gameFilesSupplied': False,
              'i386RuntimeIncluded': component_package['i386FarmIncluded'],
              'steamDockIncluded': component_package['dockHostIncluded'],
              'i386FarmIncluded': component_package['i386FarmIncluded'],
              'dockHostIncluded': component_package['dockHostIncluded'],
              'dockNoticesIncluded': component_package['dockNoticesIncluded'],
              'componentPackaging': component_package,
              'iphoneGameplayVerified': False, 'x64MicrosoftRuntimeIncluded': False,
              'next': 'Decrypt and verify on the PC, run normal Windows Security checks, then development-sign and test on the physical iPhone. No new thread required.'
          }
          (output / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          assert {path.name for path in output.iterdir()} == {'runtime.cms', 'metadata.json'}
          assert all(path.is_file() and not path.is_symlink() for path in output.iterdir())
          print(json.dumps(metadata, indent=2))
          PY
      - name: Upload only encrypted personal build and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pc-runtime-private-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pc-runtime-transfer/runtime.cms
            ${{ runner.temp }}/pc-runtime-transfer/metadata.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0


