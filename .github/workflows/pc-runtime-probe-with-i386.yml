      - name: Reject incomplete farms and inspect PE dependencies without executing them
        id: i386inspect
        if: ${{ steps.i386.outcome == 'success' && steps.dock.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          python3 - <<'PY'
          import hashlib, json, re, struct
          from pathlib import Path

          class PE:
              def __init__(self, path):
                  self.path = path
                  self.data = d = path.read_bytes()
                  assert d[:2] == b'MZ', str(path)
                  pe = struct.unpack_from('<I', d, 0x3c)[0]
                  assert d[pe:pe + 4] == b'PE\0\0', str(path)
                  self.machine, sections = struct.unpack_from('<HH', d, pe + 4)
                  optional_size = struct.unpack_from('<H', d, pe + 20)[0]
                  optional = pe + 24
                  self.magic = struct.unpack_from('<H', d, optional)[0]
                  assert self.magic in (0x10b, 0x20b), str(path)
                  self.image_base = struct.unpack_from('<I' if self.magic == 0x10b else '<Q', d, optional + (28 if self.magic == 0x10b else 24))[0]
                  directory_start = optional + (96 if self.magic == 0x10b else 112)
                  count = struct.unpack_from('<I', d, directory_start - 4)[0]
                  self.directories = [struct.unpack_from('<II', d, directory_start + i * 8) for i in range(min(count, 16))]
                  self.sections = []
                  for i in range(sections):
                      off = optional + optional_size + i * 40
                      name = d[off:off + 8].rstrip(b'\0').decode('ascii')
                      virtual_size, rva, raw_size, raw = struct.unpack_from('<IIII', d, off + 8)
                      assert raw + raw_size <= len(d), (path, name)
                      self.sections.append((name, rva, virtual_size, raw, raw_size))

              def offset(self, rva, size=1):
                  for _, start, virtual_size, raw, raw_size in self.sections:
                      if start <= rva and rva + size <= start + raw_size:
                          return raw + rva - start
                  raise ValueError(f'{self.path}: unmapped RVA {rva:x} size {size}')

              def string(self, rva):
                  off = self.offset(rva)
                  end = self.data.index(b'\0', off, min(off + 4096, len(self.data)))
                  return self.data[off:end].decode('ascii')

              def imports(self, index):
                  if index >= len(self.directories):
                      return []
                  rva, size = self.directories[index]
                  if not rva:
                      return []
                  width, fmt = (20, '<5I') if index == 1 else (32, '<8I')
                  result = []
                  for i in range(size // width):
                      fields = struct.unpack_from(fmt, self.data, self.offset(rva + i * width, width))
                      if not any(fields):
                          return result
                      name = fields[3] if index == 1 else fields[1]
                      if index == 13 and not fields[0] & 1:
                          name -= self.image_base
                      result.append(self.string(name).lower())
                  raise ValueError(f'{self.path}: unterminated import descriptors')

              def apisets(self):
                  section = next(s for s in self.sections if s[0] == '.apiset')
                  _, _, _, raw, length = section
                  data = self.data[raw:raw + length]
                  version, size, _, count, entries, _, _ = struct.unpack_from('<7I', data)
                  assert version == 6 and size <= len(data) and count < 10000
                  def name(off, length):
                      assert off + length <= size and length % 2 == 0
                      return data[off:off + length].decode('utf-16-le').lower()
                  result = {}
                  for i in range(count):
                      _, off, length, _, values, value_count = struct.unpack_from('<6I', data, entries + i * 24)
                      contract = name(off, length) + '.dll'
                      hosts = []
                      for j in range(value_count):
                          _, _, _, host, host_length = struct.unpack_from('<5I', data, values + j * 20)
                          if host_length:
                              hosts.append(name(host, host_length))
                      result[contract] = sorted(set(hosts))
                  return result

          farm = Path('app/Madeira/i386-windows')
          selected = Path('i386-selected-targets.txt').read_text().splitlines()
          assert selected and len(selected) == len(set(selected))
          assert all(re.fullmatch(r'(dlls|programs)/[^/]+/i386-windows/[^/ :]+', p) for p in selected)
          expected = {Path(p).name.lower() for p in selected}
          assert len(expected) == len(selected), 'duplicate output names in breadth set'
          dxmt = {'d3d9.dll', 'd3d9shim.dll', 'd3d9-emulated.dll', 'd3d11.dll', 'dxgi.dll', 'd3d10core.dll', 'winemetal.dll'}
          assert not expected & dxmt
          expected |= dxmt
          files = [p for p in farm.iterdir() if p.name != '.gitkeep']
          actual = {p.name.lower(): p for p in files}
          assert len(actual) == len(files) and set(actual) == expected, {'missing': sorted(expected - set(actual)), 'extra': sorted(set(actual) - expected)}
          assert {'ntdll.dll', 'kernel32.dll', 'kernelbase.dll', 'user32.dll', 'gdi32.dll', 'apisetschema.dll', 'msiexec.exe', 'fusion.dll'} <= set(actual)
          images = {name: PE(path) for name, path in actual.items() if path.suffix.lower() != '.tlb'}
          assert images and all(p.machine == 0x14c and p.magic == 0x10b for p in images.values()), 'non-i386/PE32 output in i386 farm'
          apisets = images['apisetschema.dll'].apisets()
          assert apisets, 'empty API-set schema'
          missing = []
          records = []
          def resolve(module, available, schema):
              if module in available:
                  return [module]
              hosts = schema.get(module, [])
              if hosts and all(host in available for host in hosts):
                  return hosts
              return None
          for name, pe in sorted(images.items()):
              normal, delayed = pe.imports(1), pe.imports(13)
              for kind, modules in [('normal', normal), ('delay', delayed)]:
                  for module in modules:
                      if resolve(module, images, apisets) is None:
                          missing.append({'file': name, 'kind': kind, 'import': module})
              records.append({'name': name, 'machine': hex(pe.machine), 'optional_magic': hex(pe.magic), 'sha256': hashlib.sha256(pe.data).hexdigest(), 'imports': normal, 'delay_imports': delayed})
          # This is DLL-name closure of normal and delayed imports, including API sets.
          # It does not claim exported-symbol, unix-call, loader or gameplay correctness.
          dock = Path('app/Madeira/arm64ec-windows/dockhost.exe')
          dock_pe = PE(dock)
          assert dock_pe.machine == 0x8664 and dock_pe.magic == 0x20b
          # Dock is a known x86-64 compile target. 0x8664 alone would not prove
          # that another module lacks ARM64EC/ARM64X hybrid code.
          farm64 = {p.name.lower(): p for p in dock.parent.iterdir() if p.is_file()}
          api64 = PE(farm64['apisetschema.dll']).apisets()
          dock_imports = dock_pe.imports(1) + dock_pe.imports(13)
          dock_missing = [name for name in dock_imports if resolve(name, farm64, api64) is None]
          notices = (dock.parent / 'dock-notices.txt').read_text()
          for value in ('72558e416a390f3669457930f09a389e54f49556', 'LICENSE-EXCEPTION.md', 'GNU GENERAL PUBLIC LICENSE', 'MinGW-w64 runtime notice', 'LLVM runtime notice'):
              assert value in notices, value
          report = {'wine_targets': len(selected), 'dxmt_outputs': sorted(dxmt), 'i386_pe_count': len(images), 'non_pe_type_libraries': len(actual) - len(images), 'apiset_contracts': len(apisets), 'missing_dll_names': missing, 'files': records, 'dock': {'machine': hex(dock_pe.machine), 'sha256': hashlib.sha256(dock_pe.data).hexdigest(), 'imports': dock_imports, 'missing_dll_names': dock_missing, 'notices_sha256': hashlib.sha256(notices.encode()).hexdigest()}, 'scope': 'source-built PE components; normal and delayed DLL-name closure only; no app build or target execution'}
          encoded = json.dumps(report, sort_keys=True, indent=2) + '\n'
          Path('i386-component-report.json').write_text(encoded)
          print(json.dumps({k: v for k, v in report.items() if k != 'files'}, sort_keys=True, indent=2))
          print('component_report_sha256=' + hashlib.sha256(encoded.encode()).hexdigest())
          assert not missing and not dock_missing, 'unresolved DLL names: component gate failed'
          assert actual['d3d9.dll'].read_bytes() == actual['d3d9shim.dll'].read_bytes()
          assert actual['d3d9.dll'].read_bytes() != actual['d3d9-emulated.dll'].read_bytes()
          # Bind every checked output, including type libraries and notices, to packaging.
          bundle_files = {str(path.relative_to(Path('app/Madeira'))): hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(files + [dock, dock.parent / 'dock-notices.txt'])}
          manifest = {'source': 'e3a88fddb8daed1f5ac28a45dcb4663d65192629', 'files': bundle_files, 'componentReportSha256': hashlib.sha256(encoded.encode()).hexdigest(), 'i386PeCount': len(images)}
          Path('i386-bundle-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          print('PASS: whole policy-selected i386 farm, seven DXMT files, Dock and notices; PE identities and DLL-name closure checked.')
          PY
