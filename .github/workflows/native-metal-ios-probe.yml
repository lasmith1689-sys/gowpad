name: Native UIKit D3D9 Metal renderer and shader SDK validation
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-metal-ios-probe-20261026
    paths:
    - .github/workflows/native-metal-ios-probe.yml
permissions:
  contents: read
concurrency:
  group: native-metal-ios-probe
  cancel-in-progress: false
jobs:
  metal-ios:
    if: github.ref == 'refs/heads/codex/native-metal-ios-probe-20261026'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Compile licensed UIKit renderer and own iPhone shader libraries
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,pathlib,struct,subprocess,sys\nroot=pathlib.Path('.work/native-metal-ios').absolute()\n\
        assert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))\nroot.mkdir(parents=True)\n\
        adapter=base64.b64decode('')\n\
        probe=base64.b64decode('')\n\
        assert hashlib.sha256(adapter).hexdigest()=='c1182958ad922ec66af9523bb93d174cb757de8b4da077ed20268a06caedf89f'\n\
        assert hashlib.sha256(probe).hexdigest()=='1ab77f351ab13ef8f8697f80acce89c268f79b2960ebe52db17e7a284457fb62'\n\
        (root/'make_adapter.py').write_bytes(adapter)\n(root/'shader_probe.c').write_bytes(probe)\nenv=dict(os.environ)\n\
        for key in ('SDKROOT','TOOLCHAINS','CC','CXX','CFLAGS','CXXFLAGS','LDFLAGS','MACOSX_DEPLOYMENT_TARGET','IPHONEOS_DEPLOYMENT_TARGET'):\n\
        \    env.pop(key,None)\ncommands=[]\ndef run(label,args,timeout=120):\n    args=list(map(str,args))\n  \
        \  p=subprocess.run(args,cwd=root,env=env,capture_output=True,timeout=timeout)\n    (root/(label+'.stdout.txt')).write_bytes(p.stdout)\n\
        \    (root/(label+'.stderr.txt')).write_bytes(p.stderr)\n    commands.append({'label':label,'arguments':args,'exitCode':p.returncode,\n\
        \      'stdoutSha256':hashlib.sha256(p.stdout).hexdigest(),'stderrSha256':hashlib.sha256(p.stderr).hexdigest()})\n\
        \    (root/'commands.json').write_text(json.dumps(commands,indent=2))\n    print(label,'exit',p.returncode,flush=True)\n\
        \    if p.returncode:\n        print(p.stdout.decode(errors='replace'));print(p.stderr.decode(errors='replace'))\n\
        \    assert p.returncode==0,label\n    return p.stdout.decode().strip()\nenv['DEVELOPER_DIR']=run('developer',['xcode-select','-p'])\n\
        sdk=pathlib.Path(run('ios-sdk',['xcrun','--sdk','iphoneos','--show-sdk-path']))\nsdk_version=run('ios-sdk-version',['xcrun','--sdk','iphoneos','--show-sdk-version'])\n\
        assert int(sdk_version.split('.')[0])>=26 and sdk.is_dir()\nmacsdk=pathlib.Path(run('mac-sdk',['xcrun','--sdk','macosx','--show-sdk-path']))\n\
        clang=pathlib.Path(run('clang',['xcrun','--sdk','iphoneos','--find','clang']))\nassert clang.is_file() and\
        \ pathlib.Path(env['DEVELOPER_DIR']).resolve() in clang.resolve().parents\nversion=run('clang-version',[clang,'--version'])\n\
        run('prepare-licensed-source',[sys.executable,root/'make_adapter.py','--output',root/'source'])\nhost=root/'source/recomp/host'\n\
        flags=['-target','arm64-apple-ios26.0','-isysroot',sdk,'-O2','-Wall','-Wextra']\nrenderer=root/'d3d9-metal-uikit.o';shader=root/'sm2msl-ios.o'\n\
        run('compile-ios-renderer',[clang,*flags,'-fobjc-arc','-fblocks','-Werror=implicit-function-declaration',\n\
        \  '-c',host/'d3d9_metal_ios.m','-o',renderer])\nrun('compile-ios-shadertranslator',[clang,*flags,'-std=c11','-c',host/'sm2msl.c','-o',shader])\n\
        ar=run('find-ar',['xcrun','--sdk','iphoneos','--find','ar'])\narchive=root/'libNGPD3D9MetalUIKit.a'\nrun('archive-ios-renderer',[ar,'rcs',archive,renderer,shader])\n\
        for path in (renderer,shader):\n    data=path.read_bytes();magic,cpu,subtype,kind,ncmds,cmdbytes,flags0,reserved=struct.unpack_from('<8I',data)\n\
        \    assert (magic,cpu,kind)==(0xfeedfacf,0x100000c,1)\n    pos=32;build=[]\n    for i in range(ncmds):\n\
        \        cmd,size=struct.unpack_from('<II',data,pos)\n        assert size>=8 and pos+size<=32+cmdbytes<=len(data)\n\
        \        if cmd==0x32:build.append(struct.unpack_from('<III',data,pos+8))\n        pos+=size\n    assert\
        \ pos==32+cmdbytes and len(build)==1 and build[0][0]==2 and build[0][1]==26<<16 and build[0][2]>=26<<16\n\
        nm=run('find-nm',['xcrun','--sdk','iphoneos','--find','nm'])\nundefined=run('renderer-engine-link-dependencies',[nm,'-u',renderer])\n\
        exports=run('renderer-native-definitions',[nm,'-gU',renderer])\nassert '_ngp_renderer_attach_layer' in exports\
        \ and '_d3d_backend_draw' in exports\n# Native host fixture generates only newly authored SM2/SM3 shaders.\n\
        tool=root/'own-shader-probe'\nrun('compile-own-host-fixture',[clang,'-isysroot',macsdk,'-O2','-std=c11',root/'shader_probe.c',\n\
        \  host/'sm2msl.c','-I'+str(host),'-o',tool])\nshaders=root/'own-shaders';shaders.mkdir()\noutput=run('execute-own-host-fixture',[tool,shaders])\n\
        assert output=='PASS: four newly authored SM2/SM3 shader translations'\nmetal=run('find-metal',['xcrun','--sdk','iphoneos','--find','metal'])\n\
        metallib=run('find-metallib',['xcrun','--sdk','iphoneos','--find','metallib'])\nlibraries=[]\nfor name in\
        \ ('own_vs2','own_vs3','own_ps2','own_ps3'):\n    source=shaders/(name+'.metal');air=shaders/(name+'.air');library=shaders/(name+'.metallib')\n\
        \    run('metal-'+name,[metal,'-target','air64-apple-ios26.0','-isysroot',sdk,'-std=ios-metal3.1',\n   \
        \   '-fno-fast-math','-c',source,'-o',air])\n    run('metallib-'+name,[metallib,air,'-o',library])\n   \
        \ libraries.append({'name':name,'sourceSha256':hashlib.sha256(source.read_bytes()).hexdigest(),\n      'metallibBytes':library.stat().st_size,'metallibSha256':hashlib.sha256(library.read_bytes()).hexdigest()})\n\
        manifest=json.loads((root/'source/adapter-manifest.json').read_text())\nresult={'status':'native-UIKit-renderer-and-own-SM2-SM3-iPhone-shaders-compiled',\n\
        \  'sdkVersion':sdk_version,'clangVersion':version,'upstreamCommit':manifest['upstreamCommit'],\n  'rendererSourceSha256':manifest['adaptedRendererSha256'],'adapterScriptSha256':hashlib.sha256(adapter).hexdigest(),\n\
        \  'rendererObjectBytes':renderer.stat().st_size,'rendererObjectSha256':hashlib.sha256(renderer.read_bytes()).hexdigest(),\n\
        \  'nativeArchiveBytes':archive.stat().st_size,'nativeArchiveSha256':hashlib.sha256(archive.read_bytes()).hexdigest(),\n\
        \  'rendererUndefinedSymbols':undefined.splitlines(),'compiledShaderFixtures':libraries,\n  'publicLicensedAndOwnSourcesOnly':True,'gameCodeOrAssetsUploaded':False,'runtimeInterpreterIncluded':False,\n\
        \  'fullRendererLinkedToEngine':False,'gameShaderParityVerified':False,'iphoneExecuted':False,'appCreated':False,\n\
        \  'signingRequested':False,'gameDeliveryClaimed':False}\n(root/'result.json').write_text(json.dumps(result,indent=2))\n\
        print(json.dumps(result,indent=2))\nPY\n"
