name: Generic native PC64 runtime Apple SDK proof
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-pcrecomp64-sdk-probe-20261026
    paths:
    - .github/workflows/native-pcrecomp64-sdk-probe.yml
permissions:
  contents: read
concurrency:
  group: native-pcrecomp64-sdk-probe
  cancel-in-progress: false
jobs:
  native-host:
    if: github.repository == 'lasmith1689-sys/gowpad' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-pcrecomp64-sdk-probe-20261026'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
    - name: Require exact generic public source-probe context
      id: prepare
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json,os,pathlib

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/gowpad'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/native-pcrecomp64-sdk-probe-20261026''

        event=json.loads(pathlib.Path(os.environ[''GITHUB_EVENT_PATH'']).read_text())

        assert event[''repository''][''private''] is False and event[''repository''][''full_name'']==''lasmith1689-sys/gowpad''

        root=pathlib.Path(''.work/native-pcrecomp64-sdk'').absolute()

        assert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))

        (root/''chunks'').mkdir(parents=True)

        print(''Generic MIT runtime/own-source only; no game-derived code/assets, SDK export or uploads.'')


        PY

        '
    - name: Stage generic source fragment 1
      id: stage0
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-pcrecomp64-sdk/chunks'')/''0000.b64''

        assert p.parent.is_dir() and not p.exists();p.write_text('''')


        PY

        '
    - name: Stage generic source fragment 2
      id: stage1
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-pcrecomp64-sdk/chunks'')/''0001.b64''

        assert p.parent.is_dir() and not p.exists();p.write_text('''')


        PY

        '
    - name: Stage generic source fragment 3
      id: stage2
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-pcrecomp64-sdk/chunks'')/''0002.b64''

        assert p.parent.is_dir() and not p.exists();p.write_text('''')


        PY

        '
    - name: Stage generic source fragment 4
      id: stage3
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-pcrecomp64-sdk/chunks'')/''0003.b64''

        assert p.parent.is_dir() and not p.exists();p.write_text('''')


        PY

        '
    - name: Verify exact MIT source projection and own host inputs
      id: assemble
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,zlib\nroot=pathlib.Path('.work/native-pcrecomp64-sdk').absolute();source=root/'source'\nassert root.is_dir() and not source.exists()\nparts=sorted((root/'chunks').glob('*.b64'));assert len(parts)==4\npacked=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)\nassert hashlib.sha256(packed).hexdigest()=='adbd7ef8d08a1cf9f0e70dd2407565f199162784b222ebc2aa4043488ab59a0a'\nd=zlib.decompressobj();data=d.decompress(packed,89742)\nassert d.eof and not d.unused_data and not d.unconsumed_tail and len(data)==89741\nvalues=json.loads(data);manifest={'cpu64.h': {'bytes': 23568, 'sha256': '555d3cc42360985d8b0c7d4dbb4018734cabb06f37816378a3ee6cf974646665'}, 'eh64.h': {'bytes': 3064, 'sha256': '8b5deb60934a9b58f46b24ee403541774a3f8c40c44dbad92650c4667f8aad8f'}, 'eh64.c': {'bytes': 14041, 'sha256': '9412dc4787f477cdbe4ac311ff4520ce05151e22fb35a5d29fd01a0bbf56aaca'}, 'LICENSE': {'bytes': 1063, 'sha256': 'de6601cea3a6bf2d821b6b89f59b9d6e719cc017e530bcb4bbe2fcf7306e6dda'},\
        \ 'NOTICE': {'bytes': 450, 'sha256': '9724859fb6795f675686cb4b769cabcefdd67c181428f3ffe503aa7116db9b2b'}, 'host64.h': {'bytes': 2694, 'sha256': 'eb55e8d79e165562a4845a7bc34dfeb95bdbc43970c864446edeaf0280228fe7'}, 'host64.c': {'bytes': 6836, 'sha256': '144f495c374b41e1337918adf5a9112efcc2e697ac49383f1374bd931215822e'}, 'native_required.h': {'bytes': 1294, 'sha256': '99484c143fad92dc6e4bc3b7183d90a1026a9113eb7f65737eb2f670a8941df9'}, 'native_required.c': {'bytes': 1995, 'sha256': 'aec2d7940d72b8be4adefd388c0bd2fb09ca3bc28338d441634911d4fbf97bf3'}, 'probe_runtime.c': {'bytes': 4026, 'sha256': 'b703985719b8dc37e78936ab43e52006097e4e0e6003d8e7fbaf4268c5b8c31b'}, 'sdk_probe.py': {'bytes': 4967, 'sha256': 'aa68a4df88f6f3cc9a6bda8898475800528916cab0b8ec84fad4783fe9afc808'}, 'macho.py': {'bytes': 3138, 'sha256': 'c88bc3ab0bbd1d459ba125ff3758d789d62df9666ce994fef516e4a67c26677d'}};assert set(values)==set(manifest)\nsource.mkdir()\nfor name,row in manifest.items():\n assert name==pathlib.PurePosixPath(name).name\
        \ and '/' not in name and chr(92) not in name\n b=base64.b64decode(values[name],validate=True);assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\n p=source/name;assert not p.exists();p.write_bytes(b)\nprovenance={'vendorPin':'54cb21f7110776af390bd7260a297ffcaa2a0b01','vendorInputs':{'cpu64.h': 'f05e1074479325482d6e23c274df52108ad18634f4049aa35531da7ee3e80909', 'eh64.h': '8b5deb60934a9b58f46b24ee403541774a3f8c40c44dbad92650c4667f8aad8f', 'eh64.c': 'ab7f228b601cb6311730dc4119063da8ffc6f9d18b4728d5981a64b1b4b2eb5c'},'files':manifest,\n 'gameDerivedCodeOrAssetsSupplied':False,'sdkFilesSupplied':False}\n(root/'source-closure.json').write_text(json.dumps(provenance,sort_keys=True,indent=2)+chr(10))\nprint(json.dumps(provenance,indent=2))\n\nPY\n"
    - name: Compile/link actual ARM64 iOS runtime and run native Mac proof
      id: build
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib,subprocess,sys

        root=pathlib.Path(''.work/native-pcrecomp64-sdk'').absolute()

        result=subprocess.run([sys.executable,str(root/''source/sdk_probe.py'')],cwd=root,timeout=600)

        assert result.returncode==0,''actual Apple SDK/native runtime proof must succeed''


        PY

        '
    - name: Require actual outcomes and unchanged generic source closure
      id: final
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,pathlib\nroot=pathlib.Path('.work/native-pcrecomp64-sdk').absolute();manifest=json.loads((root/'source-closure.json').read_text())\nfor name,row in manifest['files'].items():\n b=(root/'source'/name).read_bytes();assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\np=root/'output/result.json';r=json.loads(p.read_text())\nassert r['status']=='passed' and r['realSetjmpEHFramePushPopPassed'] is True and r['independentNativeGSContexts']==4\nassert r['silentNonMSVCCPUIDZeroRemoved'] is True and r['gameDerivedCodeOrAssetsSupplied'] is False\nassert r['runtimeInterpreterUsed'] is False and r['WindowsForwardingUsed'] is False\nassert r['iosExecuted'] is False and r['SDKExported'] is False and r['externalSignerInvoked'] is False\nassert r['developerIdentityUsed'] is False and r['metadata']['ios']['codeSignatures']==0\nprint(json.dumps({'resultSha256':hashlib.sha256(p.read_bytes()).hexdigest(),\n 'artifacts':r['artifacts'],'actualMacJmpBufBytes':r['actualMacSDKJmpBufBytes'],\n\
        \ 'gameDerivedCodeOrAssetsSupplied':False,'fullGamePortClaimed':False},indent=2))\n\nPY\n"
