name: TestFlight

# My personal GoWPad: God of War (USA) as native iPhone code: Waffle565's God of War runtime (PS2Recomp fork, ported to
# OpenGL ES) with the game's EE functions, VU1 microprograms and IOP modules compiled to C++ from my own disc on my PC.
# Built on GitHub's Mac runner, signed with Apple's cloud signing and uploaded to TestFlight for internal testing only.
# The game input arrives encrypted (release asset `game-input` / gow-native-input.tar.enc, key in the GAME_KEY secret),
# is decrypted only inside the runner, and nothing derived from it is cached; the only thing kept is the simulator
# check's screenshots, for one day. The disc image itself never leaves my devices: it is copied into the app's Documents
# folder on the phone.
#
# mode: simulator  builds for the iOS Simulator and runs the app there (no disc: start-up, GL ES, shaders, boot)
#       testflight builds for the device and uploads it
on:
  workflow_dispatch:
    inputs:
      mode:
        description: simulator, testflight, or assetpacks (build and upload the disc's Apple-hosted asset packs)
        type: choice
        options: [simulator, testflight, assetpacks]
        default: simulator
      packs:
        description: assetpacks mode only, which packs (1 = PART1.PAK, 2 = PART2.PAK)
        type: string
        default: '1 2'

concurrency:
  group: testflight-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  GOWPAD_BUNDLE_ID: com.lasmith1689.gowpad

jobs:
  assetpacks:
    # the disc's PART1/PART2.PAK as Apple-hosted asset packs (ba-package needs macOS 26)
    name: Asset packs
    if: inputs.mode == 'assetpacks'
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pick the newest Xcode and free disk space
        run: |
          xcode=$(for x in /Applications/Xcode_*.app; do [ -L "$x" ] || echo "$x"; done | sort -V | tail -n 1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"
          for other in /Applications/Xcode*.app; do
            [ -L "$other" ] && continue
            [ "$(cd "$other" && pwd -P)" = "$xcode" ] || sudo rm -rf "$other" &
          done
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" "$HOME/.dotnet" /usr/local/share/dotnet &
          wait
          sw_vers
          df -h /
      - name: Package and upload the asset packs
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_KEY: ${{ secrets.GAME_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOWPAD_APPLE_ID: '6825828710'
        run: bash .github/scripts/asset-packs.sh "$RUNNER_TEMP/packs" "${{ inputs.packs }}"
      - name: Remove the decrypted disc data
        if: always()
        run: rm -rf "$RUNNER_TEMP/packs"

  build:
    name: Build (${{ inputs.mode }})
    if: inputs.mode != 'assetpacks'
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pick the newest Xcode and free disk space
        run: |
          xcode=$(for x in /Applications/Xcode_*.app; do [ -L "$x" ] || echo "$x"; done | sort -V | tail -n 1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"
          for other in /Applications/Xcode*.app; do
            [ -L "$other" ] && continue
            [ "$(cd "$other" && pwd -P)" = "$xcode" ] || sudo rm -rf "$other" &
          done
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" "$HOME/.dotnet" /usr/local/share/dotnet &
          wait
          df -h /
      - name: Install build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install cmake ninja
      - name: Decrypt my game input inside the runner
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_KEY: ${{ secrets.GAME_KEY }}
        run: |
          [ -n "$GAME_KEY" ] || { echo "::error::Add the GAME_KEY secret first."; exit 1; }
          mkdir -p "$RUNNER_TEMP/input"
          gh release download game-input -R "$GITHUB_REPOSITORY" -p gow-native-input.tar.enc -D "$RUNNER_TEMP/input"
          /opt/homebrew/opt/openssl@3/bin/openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -pass env:GAME_KEY -in "$RUNNER_TEMP/input/gow-native-input.tar.enc" -out "$RUNNER_TEMP/input/input.tar"
          tar -xf "$RUNNER_TEMP/input/input.tar" -C "$RUNNER_TEMP/input"
          rm -f "$RUNNER_TEMP/input/gow-native-input.tar.enc" "$RUNNER_TEMP/input/input.tar"
          ls -la "$RUNNER_TEMP/input/game"
          du -sh "$RUNNER_TEMP/input/generated"/*
      - name: Build the app
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '3'
        run: |
          target=device
          [ "${{ inputs.mode }}" = simulator ] && target=simulator
          bash .github/scripts/build-ios.sh "$RUNNER_TEMP/input" "$RUNNER_TEMP/work" "$target"
      - name: Run it in the iOS Simulator
        if: inputs.mode == 'simulator'
        run: bash .github/scripts/simulator-check.sh "$RUNNER_TEMP/work/GoWPad.app" "$RUNNER_TEMP/simcheck"
      - name: Keep the simulator screenshots (one day)
        if: inputs.mode == 'simulator' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-screenshots
          path: ${{ runner.temp }}/simcheck/*.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Sign and upload
        if: inputs.mode == 'testflight'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # (the build number: run × 10 + attempt, growing with every upload and every re-run)
        run: BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT)) bash .github/scripts/testflight.sh "$RUNNER_TEMP/work/GoWPad.app"
      - name: Remove the game input and everything built from it
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/input" "$RUNNER_TEMP/work" "$RUNNER_TEMP/testflight" "$RUNNER_TEMP/simcheck"
          df -h /
