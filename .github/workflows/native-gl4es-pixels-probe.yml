        \ 3\n    frames = {frame['case']: frame for frame in report['frames']}\n    assert set(frames) == {0, 1,\
        \ 2}\n    # Half-open regions, OpenGL bottom-left origin. Avoid raster/texel boundaries.\n    regions =\
        \ {\n        0: [('translated_scaled_red', (44,22,52,42), (255,0,0,255), 1),\n            ('left_outside',\
        \ (8,20,24,44), (0,0,0,255), 1),\n            ('upper_outside', (44,52,52,60), (0,0,0,255), 1),\n      \
