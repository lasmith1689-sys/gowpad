        \   assert report['gameExecuted'] is False and report['appInstalled'] is False\n    assert report['developmentSigningUsed']\
        \ is False\n    assert report['nativeCaptureSucceeded'] is True and 'failure' not in report\n    assert\
        \ report['metalDevicePresent'] is True and report['metalDeviceName']\n    assert report['initialContextWasNil']\
        \ is True and report['currentContextCleared'] is True\n    assert report['wrapperAndDriverClearAreDistinct']\
